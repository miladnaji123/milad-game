<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>میلاد گیم</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1b0b04, #6b3518, #2b1207);
    color: white;
}

.container {
    width: 92%;
    max-width: 600px;
    margin: auto;
    padding: 30px 0;
}

.logo {
    text-align: center;
    font-size: 65px;
}

h1 {
    text-align: center;
    color: #ffd98a;
    margin: 5px 0;
}

.subtitle {
    text-align: center;
    color: #f1d0a0;
    margin-bottom: 25px;
}

.page {
    background: #351b0d;
    border: 2px solid #a56832;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px #000;
}

.page h2 {
    text-align: center;
    color: #ffd98a;
}

button {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    border: none;
    border-radius: 12px;
    color: white;
    font-family: Tahoma;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.btn-offline {
    background: #a86228;
}

.btn-online {
    background: #16866d;
}

.btn-join {
    background: #7650a5;
}

.btn-chat {
    background: #963f68;
}

.btn-back {
    background: #555;
}

.hidden {
    display: none !important;
}

.room-code {
    text-align: center;
    background: #160b05;
    border: 2px dashed #e0a75c;
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
    font-size: 35px;
    font-weight: bold;
    color: #ffe19b;
    direction: ltr;
    letter-spacing: 6px;
}

input {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 12px 0;
    background: #160b05;
    color: white;
    border: 2px solid #9a5b2d;
    border-radius: 10px;
    font-family: Tahoma;
    font-size: 18px;
    text-align: center;
}

.message {
    text-align: center;
    color: #ffd98a;
    line-height: 2;
    margin-top: 15px;
}

.chat-box {
    height: 250px;
    overflow-y: auto;
    background: #160b05;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
}

.chat-message {
    background: #68401f;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
}

.footer {
    text-align: center;
    color: #c9a77c;
    margin-top: 25px;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">🎲</div>

<h1>میلاد گیم</h1>

<div class="subtitle">
بازی تخته نرد آنلاین و آفلاین با دوستان
</div>


<!-- صفحه اصلی -->

<div id="home" class="page">

<h2>🎮 انتخاب نوع بازی</h2>

<button id="offlineBtn" class="btn-offline">
🎲 بازی آفلاین دو نفره
</button>

<button id="createBtn" class="btn-online">
🌐 ساخت اتاق آنلاین
</button>

<button id="joinBtn" class="btn-join">
🔑 ورود به اتاق دوست
</button>

<button id="chatBtn" class="btn-chat">
💬 چت فارسی
</button>

</div>


<!-- صفحه ساخت اتاق -->

<div id="createPage" class="page hidden">

<h2>🏠 ساخت اتاق آنلاین</h2>

<p class="message">
کد اتاق شما:
</p>

<div id="roomCode" class="room-code">
------
</div>

<button id="copyBtn" class="btn-online">
📋 کپی کد اتاق
</button>

<button id="inviteBtn" class="btn-join">
📤 دعوت از دوست
</button>

<button id="startOnlineBtn" class="btn-online">
🎲 شروع بازی
</button>

<button class="btn-back backBtn">
↩️ بازگشت
</button>

<div id="createMessage" class="message"></div>

</div>


<!-- صفحه ورود -->

<div id="joinPage" class="page hidden">

<h2>🔑 ورود به اتاق دوست</h2>

<p class="message">
کد ۶ رقمی اتاق را وارد کن:
</p>

<input
id="joinInput"
type="text"
maxlength="6"
inputmode="numeric"
placeholder="مثلاً 123456">

<button id="joinRoomBtn" class="btn-online">
🚪 ورود به اتاق
</button>

<button class="btn-back backBtn">
↩️ بازگشت
</button>

<div id="joinMessage" class="message"></div>

</div>


<!-- صفحه چت -->

<div id="chatPage" class="page hidden">

<h2>💬 چت فارسی</h2>

<div id="chatBox" class="chat-box">

<div class="chat-message">
🤖 سیستم: به میلاد گیم خوش آمدید.
</div>

</div>

<input
id="chatInput"
type="text"
placeholder="پیام خود را بنویس...">

<button id="sendChatBtn" class="btn-chat">
📤 ارسال پیام
</button>

<button class="btn-back backBtn">
↩️ بازگشت
</button>

</div>


<div class="footer">
🎲 میلاد گیم
<br>
نسخه آزمایشی
</div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function() {

    const home =
        document.getElementById("home");

    const createPage =
        document.getElementById("createPage");

    const joinPage =
        document.getElementById("joinPage");

    const chatPage =
        document.getElementById("chatPage");


    function showPage(page) {

        home.classList.add("hidden");
        createPage.classList.add("hidden");
        joinPage.classList.add("hidden");
        chatPage.classList.add("hidden");

        page.classList.remove("hidden");

        window.scrollTo(0, 0);
    }


    function goHome() {

        showPage(home);

    }


    // بازی آفلاین

    document
    .getElementById("offlineBtn")
    .addEventListener("click", function() {

        alert(
            "🎲 بازی آفلاین\n\n" +
            "صفحه بازی تخته نرد در مرحله بعد اضافه می‌شود."
        );

    });


    // ساخت اتاق

    document
    .getElementById("createBtn")
    .addEventListener("click", function() {

        let code =
            Math.floor(
                100000 +
                Math.random() * 900000
            ).toString();

        document
        .getElementById("roomCode")
        .textContent = code;

        document
        .getElementById("createMessage")
        .textContent =
        "✅ اتاق با موفقیت ساخته شد.";

        showPage(createPage);

    });


    // کپی کد

    document
    .getElementById("copyBtn")
    .addEventListener("click", function() {

        let code =
            document
            .getElementById("roomCode")
            .textContent;

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            navigator.clipboard
            .writeText(code)
            .then(function() {

                document
                .getElementById("createMessage")
                .textContent =
                "✅ کد اتاق کپی شد.";

            });

        } else {

            alert(
                "کد اتاق شما:\n" + code
            );

        }

    });


    // دعوت از دوست

    document
    .getElementById("inviteBtn")
    .addEventListener("click", function() {

        let code =
            document
            .getElementById("roomCode")
            .textContent;

        let text =
            "🎲 بیا در میلاد گیم با هم تخته نرد بازی کنیم!\n" +
            "کد اتاق: " + code;

        if (navigator.share) {

            navigator.share({

                title:
                "دعوت به میلاد گیم",

                text:
                text,

                url:
                window.location.href

            });

        } else {

            alert(text);

        }

    });


    // شروع بازی آنلاین

    document
    .getElementById("startOnlineBtn")
    .addEventListener("click", function() {

        alert(
            "🎲 اتاق بازی آماده است!\n\n" +
            "بازی آنلاین واقعی در مرحله بعد به سرور وصل می‌شود."
        );

    });


    // صفحه ورود

    document
    .getElementById("joinBtn")
    .addEventListener("click", function() {

        showPage(joinPage);

    });


    // ورود به اتاق

    document
    .getElementById("joinRoomBtn")
    .addEventListener("click", function() {

        let code =
            document
            .getElementById("joinInput")
            .value
            .trim();

        let message =
            document
            .getElementById("joinMessage");

        if (
            !/^[0-9]{6}$/.test(code)
        ) {

            message.textContent =
            "❌ لطفاً یک کد ۶ رقمی وارد کن.";

            return;

        }

        message.textContent =
        "✅ کد اتاق درست است. اتصال واقعی به سرور در مرحله بعد فعال می‌شود.";

    });


    // صفحه چت

    document
    .getElementById("chatBtn")
    .addEventListener("click", function() {

        showPage(chatPage);

    });


    // ارسال پیام

    function sendChat() {

        let input =
            document
            .getElementById("chatInput");

        let text =
            input.value.trim();

        if (text === "") {

            return;

        }

        let message =
            document.createElement("div");

        message.className =
            "chat-message";

        message.textContent =
            "👤 شما: " + text;

        document
        .getElementById("chatBox")
        .appendChild(message);

        input.value = "";

        document
        .getElementById("chatBox")
        .scrollTop =
        document
        .getElementById("chatBox")
        .scrollHeight;

    }


    document
    .getElementById("sendChatBtn")
    .addEventListener(
        "click",
        sendChat
    );


    document
    .getElementById("chatInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                sendChat();

            }

        }
    );


    // همه دکمه‌های بازگشت

    document
    .querySelectorAll(".backBtn")
    .forEach(function(button) {

        button.addEventListener(
            "click",
            goHome
        );

    });

});

</script>

</body>
</html>
