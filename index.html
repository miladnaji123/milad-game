<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎲 Milad Game - تخته نرد آنلاین</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#17100b;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    background:#21150e;
    padding:15px;
    text-align:center;
    border-bottom:2px solid #6b4225;
}

h1{
    margin:0 0 7px;
    font-size:25px;
}

#connection{
    font-size:14px;
}

.green{color:#00e676}
.red{color:#ff5252}

.container{
    width:96%;
    max-width:1100px;
    margin:auto;
    padding:15px 0;
}

.panel{
    background:#25180f;
    border:1px solid #67401f;
    border-radius:14px;
    padding:15px;
    margin-bottom:15px;
    text-align:center;
}

.hidden{
    display:none!important;
}

input{
    background:#120c08;
    color:white;
    border:1px solid #8a5a32;
    border-radius:8px;
    padding:12px;
    font-size:17px;
    text-align:center;
    outline:none;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 18px;
    margin:5px;
    color:white;
    background:#8b572a;
    font-size:16px;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

.greenBtn{
    background:#287d3c;
}

.blueBtn{
    background:#1769aa;
}

.redBtn{
    background:#a52a2a;
}

#roomCode{
    font-size:29px;
    color:#ffd54f;
    letter-spacing:5px;
    margin:10px;
    direction:ltr;
}

#players{
    margin:8px;
    font-size:17px;
}

/* =========================
   BACKGAMMON BOARD
========================= */

.board-wrapper{
    width:100%;
    overflow-x:auto;
    padding:5px;
}

.board{
    position:relative;
    width:min(900px,96vw);
    aspect-ratio:1.75/1;
    min-width:650px;
    margin:15px auto;

    background:
        linear-gradient(
            90deg,
            #6b351c 0 3%,
            #a45b2b 3% 97%,
            #6b351c 97% 100%
        );

    border:12px solid #422311;
    border-radius:10px;

    box-shadow:
        0 8px 25px #000,
        inset 0 0 20px #241108;

    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:4px;

    padding:14px 12px;
}

.point{
    position:relative;
    height:100%;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
}

.point.bottom{
    justify-content:flex-end;
}

.triangle{
    position:absolute;
    left:7%;
    width:86%;
    height:48%;
    background:#d8a04f;
    clip-path:polygon(50% 100%,0 0,100% 0);
}

.bottom .triangle{
    top:auto;
    bottom:0;
    transform:rotate(180deg);
}

.point:nth-child(even) .triangle{
    background:#64271b;
}

.checkers{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    max-height:95%;
    overflow:hidden;
}

.bottom .checkers{
    flex-direction:column-reverse;
}

.checker{
    width:clamp(25px,4.3vw,48px);
    height:clamp(25px,4.3vw,48px);
    border-radius:50%;
    margin:1px 0;

    border:2px solid #222;

    box-shadow:
        inset 2px 2px 5px #fff8,
        inset -3px -3px 5px #0008,
        0 2px 4px #000;

    flex-shrink:0;
}

.checker.white{
    background:
        radial-gradient(circle at 35% 30%,#fff,#ddd 55%,#aaa);
}

.checker.black{
    background:
        radial-gradient(circle at 35% 30%,#555,#222 55%,#050505);
}

.point.selected{
    outline:4px solid #ffd740;
    outline-offset:-4px;
}

.point.valid{
    outline:3px solid #00e676;
    outline-offset:-3px;
}

.bar{
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    transform:translateX(-50%);
    width:35px;
    background:#3b1d0d;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
}

.bar-label{
    writing-mode:vertical-rl;
    color:#d7a35a;
    font-size:11px;
}

/* =========================
   DICE
========================= */

.dice-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:12px;
}

.die{
    width:62px;
    height:62px;
    background:#eee;
    color:#111;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
    box-shadow:0 4px 8px #000;
}

.turn{
    color:#ffd740;
    font-weight:bold;
}

/* =========================
   CHAT
========================= */

.chat-box{
    max-width:650px;
    margin:auto;
}

#messages{
    height:190px;
    overflow-y:auto;
    background:#110b07;
    border:1px solid #4c2d18;
    border-radius:10px;
    padding:10px;
    text-align:right;
}

.message{
    background:#2d1c11;
    padding:7px 10px;
    border-radius:7px;
    margin:5px 0;
    word-break:break-word;
}

.chat-row{
    display:flex;
    gap:5px;
    margin-top:8px;
}

.chat-row input{
    flex:1;
    width:auto;
}

.notice{
    background:#321f12;
    border-radius:8px;
    padding:9px;
    margin:8px 0;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    h1{
        font-size:21px;
    }

    .board{
        min-width:620px;
    }

    .panel{
        padding:10px;
    }

    button{
        font-size:14px;
        padding:10px 13px;
    }

    input{
        max-width:95%;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎲 Milad Game</h1>
    <div id="connection" class="red">
        🔴 در حال اتصال به سرور...
    </div>
</header>

<div class="container">

<!-- =========================
     LOBBY
========================= -->

<div id="lobby" class="panel">

    <h2>🎮 بازی آنلاین</h2>

    <p>
        برای بازی با دوستت اتاق بساز یا با کد وارد شو.
    </p>

    <button
        class="greenBtn"
        onclick="createRoom()">
        ➕ ساخت اتاق
    </button>

    <br>

    <input
        id="roomInput"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="کد ۶ رقمی">

    <button
        class="blueBtn"
        onclick="joinRoom()">
        🚪 ورود به اتاق
    </button>

    <div
        id="lobbyMessage"
        class="notice">
        در حال اتصال...
    </div>

</div>


<!-- =========================
     ROOM
========================= -->

<div
    id="roomPanel"
    class="panel hidden">

    <h2>🏠 اتاق بازی</h2>

    <div>کد اتاق:</div>

    <div id="roomCode">
        ------
    </div>

    <div id="players">
        👤 بازیکنان: 1 / 2
    </div>

    <div
        id="gameStatus"
        class="notice">
        منتظر بازیکن دوم...
    </div>

    <button
        onclick="copyRoomCode()">
        📋 کپی کد اتاق
    </button>

</div>


<!-- =========================
     GAME
========================= -->

<div
    id="gamePanel"
    class="panel hidden">

    <h2>♟️ تخته نرد کلاسیک</h2>

    <div id="turnText" class="turn">
        منتظر شروع بازی...
    </div>

    <div class="dice-area">

        <div id="die1" class="die">
            ⚀
        </div>

        <div id="die2" class="die">
            ⚀
        </div>

    </div>

    <button
        id="rollButton"
        class="greenBtn"
        onclick="rollDice()">
        🎲 ریختن تاس
    </button>

    <div class="board-wrapper">

        <div id="board" class="board">

            <div class="bar">
                <span class="bar-label">
                    BAR
                </span>
            </div>

        </div>

    </div>

    <div
        id="gameMessage"
        class="notice">
        منتظر بازیکن دوم...
    </div>

</div>


<!-- =========================
     CHAT
========================= -->

<div
    id="chatPanel"
    class="panel hidden">

    <h2>💬 چت بازی</h2>

    <div class="chat-box">

        <div id="messages"></div>

        <div class="chat-row">

            <input
                id="chatInput"
                type="text"
                maxlength="500"
                placeholder="پیام خود را بنویس..."
                onkeydown="chatKey(event)">

            <button
                onclick="sendChat()">
                ارسال
            </button>

        </div>

    </div>

</div>

</div>

<script>

/* =========================
   SERVER
========================= */

const SERVER_URL =
    "https://milad-game-server.onrender.com";

const socket =
    io(SERVER_URL,{
        transports:["websocket","polling"]
    });


/* =========================
   GAME VARIABLES
========================= */

let connected=false;
let currentRoom=null;
let playerIndex=null;

let gameStarted=false;
let myTurn=false;

let dice=[
    0,
    0
];

let remainingDice=[];

let selectedPoint=null;


/*
    board[0..23]

    مثبت = سفید
    منفی = مشکی

    این چیدمان استاندارد تخته نرد است.
*/

let boardState=[
     2, 0, 0, 0, 0,-5,
     0,-3, 0, 0, 0, 5,

    -5, 0, 0, 0, 3, 0,
     5, 0, 0, 0, 0,-2
];


/* =========================
   DOM
========================= */

const $ =
    id => document.getElementById(id);


/* =========================
   CONNECTION
========================= */

socket.on("connect",()=>{

    connected=true;

    $("connection").className=
        "green";

    $("connection").textContent=
        "🟢 اتصال به سرور برقرار است";

    $("lobbyMessage").textContent=
        "سرور آماده است. می‌توانی اتاق بسازی.";

});


socket.on("disconnect",()=>{

    connected=false;

    $("connection").className=
        "red";

    $("connection").textContent=
        "🔴 اتصال به سرور قطع شد";

});


/* =========================
   CREATE ROOM
========================= */

function createRoom(){

    if(!connected){

        alert(
            "هنوز به سرور متصل نشده‌ای."
        );

        return;
    }

    socket.emit("createRoom");

}


socket.on("roomCreated",data=>{

    currentRoom=
        data.roomCode;

    playerIndex=0;

    showRoom();

    $("roomCode").textContent=
        currentRoom;

    $("gameStatus").textContent=
        "منتظر بازیکن دوم...";

});


/* =========================
   JOIN ROOM
========================= */

function joinRoom(){

    if(!connected){

        alert(
            "اتصال به سرور برقرار نیست."
        );

        return;
    }

    const code=
        $("roomInput")
        .value
        .trim();

    if(!/^\d{6}$/.test(code)){

        alert(
            "کد باید دقیقاً ۶ رقم باشد."
        );

        return;
    }

    socket.emit(
        "joinRoom",
        code
    );

}


socket.on("joinedRoom",data=>{

    currentRoom=
        data.roomCode;

    playerIndex=1;

    showRoom();

    $("roomCode").textContent=
        currentRoom;

});


socket.on("joinError",data=>{

    alert(
        data.message ||
        "ورود به اتاق ناموفق بود."
    );

});


/* =========================
   SHOW ROOM
========================= */

function showRoom(){

    $("lobby")
        .classList
        .add("hidden");

    $("roomPanel")
        .classList
        .remove("hidden");

    $("chatPanel")
        .classList
        .remove("hidden");

}


/* =========================
   PLAYERS
========================= */

socket.on("playersUpdate",data=>{

    $("players").textContent=
        `👤 بازیکنان: ${data.players} / 2`;

});


/* =========================
   GAME READY
========================= */

socket.on("gameReady",data=>{

    gameStarted=true;

    $("gamePanel")
        .classList
        .remove("hidden");

    $("gameStatus").textContent=
        "🟢 بازی آماده است!";

    $("gameMessage").textContent=
        "بازیکن اول شروع می‌کند.";

    /*
       بازیکن اول شروع می‌کند.
    */

    myTurn=
        playerIndex===0;

    updateTurn();

    renderBoard();

});


/* =========================
   COPY ROOM
========================= */

function copyRoomCode(){

    if(!currentRoom)return;

    navigator.clipboard
        .writeText(currentRoom)
        .then(()=>{

            alert(
                "کد اتاق کپی شد."
            );

        });

}


/* =========================
   BOARD
========================= */

function renderBoard(){

    const board=
        $("board");

    /*
       BAR را نگه می‌داریم.
    */

    board.innerHTML=
        '<div class="bar"><span class="bar-label">BAR</span></div>';

    /*
       12 خانه بالا
    */

    for(let i=0;i<12;i++){

        const point=
            createPoint(i,false);

        board.appendChild(point);

    }

    /*
       12 خانه پایین
    */

    for(let i=12;i<24;i++){

        const point=
            createPoint(i,true);

        board.appendChild(point);

    }

}


/* =========================
   POINT
========================= */

function createPoint(index,bottom){

    const point=
        document.createElement("div");

    point.className=
        "point";

    if(bottom)
        point.classList.add("bottom");

    point.dataset.index=
        index;

    const triangle=
        document.createElement("div");

    triangle.className=
        "triangle";

    const checkers=
        document.createElement("div");

    checkers.className=
        "checkers";

    const count=
        Math.abs(boardState[index]);

    const color=
        boardState[index]>0
        ?"white"
        :"black";

    /*
       بیشتر از 5 مهره را
       داخل خانه نشان نمی‌دهیم.
    */

    for(
        let i=0;
        i<Math.min(count,5);
        i++
    ){

        const checker=
            document.createElement("div");

        checker.className=
            "checker "+color;

        checkers.appendChild(
            checker
        );

    }

    if(count>5){

        const more=
            document.createElement("div");

        more.textContent=
            `+${count-5}`;

        more.style.position=
            "absolute";

        more.style.zIndex=
            "10";

        more.style.background=
            "#ffd740";

        more.style.color=
            "#111";

        more.style.borderRadius=
            "50%";

        more.style.padding=
            "3px 7px";

        checkers.appendChild(
            more
        );

    }

    point.appendChild(
        triangle
    );

    point.appendChild(
        checkers
    );

    point.onclick=()=>{
        selectPoint(index);
    };

    if(
        selectedPoint===index
    ){

        point.classList.add(
            "selected"
        );

    }

    return point;

}


/* =========================
   SELECT / MOVE
========================= */

function selectPoint(index){

    if(!gameStarted)return;

    if(!myTurn){

        $("gameMessage").textContent=
            "⏳ الان نوبت شما نیست.";

        return;
    }

    /*
       اگر مهره‌ای انتخاب نشده
    */

    if(selectedPoint===null){

        const mine=
            playerIndex===0
            ?boardState[index]>0
            :boardState[index]<0;

        if(!mine){

            $("gameMessage").textContent=
                "❌ این مهره متعلق به شما نیست.";

            return;
        }

        selectedPoint=index;

        renderBoard();

        $("gameMessage").textContent=
            "خانه مقصد را انتخاب کن.";

        return;
    }


    /*
       اگر دوباره همان خانه را زد
    */

    if(selectedPoint===index){

        selectedPoint=null;

        renderBoard();

        return;
    }


    /*
       تلاش برای حرکت
    */

    attemptMove(
        selectedPoint,
        index
    );

}


/* =========================
   MOVE VALIDATION
========================= */

function attemptMove(from,to){

    if(remainingDice.length===0){

        $("gameMessage").textContent=
            "ابتدا تاس بریز.";

        selectedPoint=null;

        renderBoard();

        return;
    }

    /*
       جهت حرکت سفید:
       از خانه‌های پایین به بالا

       جهت حرکت مشکی:
       برعکس
    */

    const distance=
        playerIndex===0
        ?to-from
        :from-to;

    if(distance<=0){

        $("gameMessage").textContent=
            "❌ جهت حرکت درست نیست.";

        return;
    }

    /*
       فقط برای تست اولیه
       از یکی از تاس‌ها استفاده می‌کنیم.
    */

    const diceIndex=
        remainingDice.indexOf(
            distance
        );

    if(diceIndex===-1){

        $("gameMessage").textContent=
            "❌ این حرکت با تاس فعلی ممکن نیست.";

        return;
    }

    /*
       مقصد
    */

    const target=
        boardState[to];

    const opponent=
        playerIndex===0
        ?target<0
        :target>0;

    if(
        opponent &&
        Math.abs(target)>1
    ){

        $("gameMessage").textContent=
            "❌ این خانه بسته است.";

        return;
    }


    /*
       اجرای حرکت
    */

    if(playerIndex===0){

        boardState[from]--;
        boardState[to]++;

    }else{

        boardState[from]++;
        boardState[to]--;

    }


    /*
       اگر یک مهره حریف بود
       فعلاً از صفحه خارج می‌شود.
    */

    if(opponent){

        if(playerIndex===0)
            boardState[to]=1;
        else
            boardState[to]=-1;

    }


    remainingDice.splice(
        diceIndex,
        1
    );

    selectedPoint=null;

    sendGameState();

    renderBoard();

    if(
        remainingDice.length===0
    ){

        endTurn();

    }

}


/* =========================
   SEND GAME STATE
========================= */

function sendGameState(){

    socket.emit(
        "gameState",
        {
            board:boardState,
            dice:dice,
            remainingDice:remainingDice,
            turn:playerIndex,
            time:Date.now()
        }
    );

}


/* =========================
   RECEIVE GAME STATE
========================= */

socket.on("gameState",data=>{

    if(!data)return;

    if(
        Array.isArray(data.board)
    ){

        boardState=
            data.board.slice();

    }

    if(
        Array.isArray(data.dice)
    ){

        dice=
            data.dice.slice();

    }

    remainingDice=[];

    myTurn=
        data.turn===playerIndex;

    renderBoard();

    updateTurn();

});


/* =========================
   DICE
========================= */

function rollDice(){

    if(!gameStarted){

        alert(
            "بازی هنوز شروع نشده."
        );

        return;
    }

    if(!myTurn){

        $("gameMessage").textContent=
            "⏳ نوبت شما نیست.";

        return;
    }

    if(
        remainingDice.length>0
    ){

        $("gameMessage").textContent=
            "ابتدا از تاس قبلی استفاده کن.";

        return;
    }

    const d1=
        Math.floor(
            Math.random()*6
        )+1;

    const d2=
        Math.floor(
            Math.random()*6
        )+1;

    dice=[
        d1,
        d2
    ];

    /*
       جفت
       چهار حرکت
    */

    if(d1===d2){

        remainingDice=[
            d1,
            d1,
            d1,
            d1
        ];

    }else{

        remainingDice=[
            d1,
            d2
        ];

    }

    showDice();

    socket.emit(
        "diceRolled",
        {
            dice:dice,
            player:playerIndex,
            time:Date.now()
        }
    );

    sendGameState();

    $("gameMessage").textContent=
        "🎲 تاس ریخته شد. مهره را انتخاب کن.";

}


/* =========================
   RECEIVE DICE
========================= */

socket.on("diceRolled",data=>{

    if(!data)return;

    if(
        Array.isArray(data.dice)
    ){

        dice=
            data.dice.slice();

    }

    showDice();

});


function showDice(){

    $("die1").textContent=
        diceEmoji(
            dice[0]||1
        );

    $("die2").textContent=
        diceEmoji(
            dice[1]||1
        );

}


function diceEmoji(n){

    const list=[
        "",
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ];

    return list[n]||"🎲";

}


/* =========================
   TURN
========================= */

function endTurn(){

    myTurn=false;

    socket.emit(
        "gameState",
        {
            board:boardState,
            dice:dice,
            remainingDice:[],
            turn:
                playerIndex===0
                ?1
                :0,
            time:Date.now()
        }
    );

    $("gameMessage").textContent=
        "⏳ نوبت بازیکن مقابل...";

    updateTurn();

}


function updateTurn(){

    if(myTurn){

        $("turnText").textContent=
            "🟢 نوبت شماست";

        $("rollButton")
            .disabled=false;

    }else{

        $("turnText").textContent=
            "⏳ نوبت بازیکن مقابل";

        $("rollButton")
            .disabled=true;

    }

}


/* =========================
   CHAT
========================= */

function sendChat(){

    const input=
        $("chatInput");

    const text=
        input.value.trim();

    if(!text)return;

    socket.emit(
        "chatMessage",
        {
            text
