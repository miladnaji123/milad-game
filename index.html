<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milad Game</title>
<style>
body{
    margin:0;
    min-height:100vh;
    background:#24130b;
    color:white;
    font-family:Tahoma,Arial,sans-serif;
    text-align:center;
}
.box{
    margin:60px auto;
    width:90%;
    max-width:600px;
    padding:30px;
    background:#3a1d0e;
    border:2px solid #a85f22;
    border-radius:20px;
}
button{
    padding:15px 25px;
    margin:10px;
    border:0;
    border-radius:10px;
    background:#a85f22;
    color:white;
    font-size:18px;
}
</style>
</head>

<body>

<div class="box">
    <h1>🎲 میلاد گیم</h1>
    <h2>بازی تخته نرد</h2>

    <p>صفحه بازی با موفقیت اجرا شد ✅</p>

    <button onclick="alert('بازی آفلاین آماده است 🎮')">
        🎮 بازی آفلاین
    </button>
</div>

</body>
</html>
