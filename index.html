<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎲 Milad Game</title>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #151515;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 96%;
      max-width: 950px;
      margin: auto;
      padding: 15px;
    }

    h1 {
      margin: 8px 0 15px;
    }

    .status {
      background: #292929;
      padding: 12px;
      border-radius: 12px;
      margin: 10px 0;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #ff6b6b;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 22px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    #quickJoinBtn {
      background: #16a34a;
      color: white;
      font-weight: bold;
      width: 90%;
      max-width: 350px;
    }

    #diceBtn {
      background: #2563eb;
      color: white;
    }

    button:disabled {
      opacity: .5;
    }

    .waiting {
      display: none;
      background: #292929;
      padding: 18px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .game {
      display: none;
    }

    .players {
      display: flex;
      gap: 10px;
      margin: 12px 0;
    }

    .player {
      flex: 1;
      background: #292929;
      padding: 10px;
      border-radius: 12px;
    }

    .board-wrapper {
      background: #55351f;
      border-radius: 18px;
      padding: 10px;
      margin-top: 15px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      background: #704523;
      padding: 8px;
      border-radius: 12px;
    }

    .cell {
      position: relative;
      min-height: 115px;
      background: #d29a58;
      border-radius: 5px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      overflow: hidden;
    }

    .cell:nth-child(even) {
      background: #b87338;
    }

    .cell.selected {
      outline: 4px solid #ffe600;
      transform: scale(1.02);
      z-index: 2;
    }

    .cell.possible {
      outline: 3px solid #36ff75;
    }

    .cell-number {
      font-size: 11px;
      color: #222;
      margin-bottom: 3px;
      font-weight: bold;
    }

    .checkers {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .checker {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      margin: 1px;
      border: 2px solid #222;
      box-shadow: 0 2px 4px rgba(0,0,0,.5);
    }

    .white {
      background: #f4f4f4;
    }

    .black {
      background: #111;
      border-color: #777;
    }

    .dice-area {
      background: #292929;
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
    }

    #dice {
      font-size: 34px;
      margin-top: 8px;
      min-height: 45px;
    }

    .help {
      color: #ccc;
      font-size: 13px;
      margin: 10px 0;
    }

    .chat {
      background: #292929;
      padding: 12px;
      border-radius: 12px;
      margin-top: 15px;
    }

    #messages {
      height: 170px;
      overflow-y: auto;
      background: #111;
      border-radius: 10px;
      padding: 8px;
      text-align: right;
    }

    .message {
      background: #333;
      padding: 8px;
      border-radius: 8px;
      margin: 5px 0;
    }

    .chat-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    #chatInput {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
    }

    #sendBtn {
      background: #16a34a;
      color: white;
    }

    @media(max-width:600px) {
      .cell {
        min-height: 82px;
      }

      .checker {
        width: 22px;
        height: 22px;
      }

      .board {
        gap: 2px;
        padding: 5px;
      }

      .cell-number {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎲 Milad Game</h1>

  <div id="status" class="status">
    ⏳ در حال اتصال به سرور...
  </div>

  <div id="menu">

    <button id="quickJoinBtn">
      ⚡ ورود سریع بدون کد
    </button>

    <div id="waiting" class="waiting">
      ⏳ منتظر پیدا شدن حریف هستید...
      <br><br>
      بازیکن دیگری که وارد شود، بازی خودکار شروع می‌شود.
    </div>

  </div>


  <div id="game" class="game">

    <div class="players">

      <div class="player">
        👤 بازیکن اول
        <br>
        <span id="player1Status">🔴 انتظار</span>
      </div>

      <div class="player">
        👤 بازیکن دوم
        <br>
        <span id="player2Status">🔴 انتظار</span>
      </div>

    </div>


    <div id="turn" class="status">
      منتظر شروع بازی...
    </div>


    <div class="dice-area">

      <button id="diceBtn">
        🎲 ریختن تاس
      </button>

      <div id="dice">
        🎲 🎲
      </div>

      <div class="help">
        ابتدا تاس بریزید، سپس روی مهره خود و بعد روی خانه مقصد بزنید.
      </div>

    </div>


    <div class="board-wrapper">
      <div id="board" class="board"></div>
    </div>


    <div class="chat">

      <h3>💬 چت بازی</h3>

      <div id="messages">
        <div class="message">
          به چت بازی خوش آمدید 🌹
        </div>
      </div>

      <div class="chat-row">

        <input
          id="chatInput"
          type="text"
          maxlength="500"
          placeholder="پیام خود را بنویسید..."
        >

        <button id="sendBtn">
          ارسال
        </button>

      </div>

    </div>

  </div>

</div>


<script>

const SERVER_URL =
  "https://milad-game-server.onrender.com";

const socket = io(SERVER_URL, {
  transports: ["websocket", "polling"]
});


let gameId = null;
let myPlayerNumber = null;

let player1Id = null;
let player2Id = null;

let currentTurn = null;

let boardState = [
  2, 0, 0, 0, 0, -5,
  0, -3, 0, 0, 0, 5,
  -5, 0, 0, 0, 3, 0,
  5, 0, 0, 0, 0, -2
];

let diceValues = [];

let selectedPoint = null;

let remainingMoves = [];


/* =========================================
   عناصر
========================================= */

const statusEl =
  document.getElementById("status");

const menu =
  document.getElementById("menu");

const game =
  document.getElementById("game");

const waiting =
  document.getElementById("waiting");

const quickJoinBtn =
  document.getElementById("quickJoinBtn");

const boardEl =
  document.getElementById("board");

const diceEl =
  document.getElementById("dice");

const diceBtn =
  document.getElementById("diceBtn");

const turnEl =
  document.getElementById("turn");

const messages =
  document.getElementById("messages");

const chatInput =
  document.getElementById("chatInput");

const sendBtn =
  document.getElementById("sendBtn");


/* =========================================
   اتصال
========================================= */

socket.on("connect", () => {

  statusEl.textContent =
    "🟢 اتصال به سرور برقرار است";

  statusEl.className =
    "status success";

  quickJoinBtn.disabled = false;

});


socket.on("connect_error", () => {

  statusEl.textContent =
    "🔴 اتصال به سرور برقرار نشد";

  statusEl.className =
    "status error";

  quickJoinBtn.disabled = true;

});


socket.on("disconnect", () => {

  statusEl.textContent =
    "⚠️ اتصال به سرور قطع شد";

  statusEl.className =
    "status error";

});


/* =========================================
   ورود سریع
========================================= */

quickJoinBtn.addEventListener(
  "click",
  () => {

    if (!socket.connected) {

      alert(
        "به سرور متصل نیستید."
      );

      return;
    }

    quickJoinBtn.disabled = true;

    waiting.style.display =
      "block";

    statusEl.textContent =
      "⏳ در حال پیدا کردن حریف...";

    socket.emit("quickJoin");

  }
);


/* =========================================
   انتظار
========================================= */

socket.on("waiting", (data) => {

  waiting.style.display =
    "block";

  statusEl.textContent =
    data.message ||
    "⏳ منتظر حریف هستید...";

});


/* =========================================
   پیدا شدن حریف
========================================= */

socket.on("matched", (data) => {

  gameId =
    data.gameId;

  myPlayerNumber =
    data.player;

  waiting.style.display =
    "none";

  menu.style.display =
    "none";

  game.style.display =
    "block";

  statusEl.textContent =
    "🎉 حریف پیدا شد!";

  statusEl.className =
    "status success";

});


/* =========================================
   شروع بازی
========================================= */

socket.on("gameReady", (data) => {

  gameId =
    data.gameId;

  player1Id =
    data.player1;

  player2Id =
    data.player2;

  currentTurn =
    data.turn;

  if (data.board) {

    boardState =
      [...data.board];

  }

  renderBoard();

  updateTurn();

});


/* =========================================
   بازیکنان
========================================= */

socket.on("playersUpdate", (data) => {

  if (data.count >= 2) {

    document.getElementById(
      "player1Status"
    ).textContent =
      "🟢 آنلاین";

    document.getElementById(
      "player2Status"
    ).textContent =
      "🟢 آنلاین";

  }

});


/* =========================================
   نوبت
========================================= */

function updateTurn() {

  if (!currentTurn) {

    turnEl.textContent =
      "منتظر شروع بازی...";

    return;
  }

  if (
    currentTurn === socket.id
  ) {

    turnEl.textContent =
      "🎯 نوبت شماست";

    diceBtn.disabled =
      diceValues.length > 0 &&
      remainingMoves.length > 0;

  } else {

    turnEl.textContent =
      "⏳ نوبت حریف است";

    diceBtn.disabled =
      true;

  }

}


/* =========================================
   تاس
========================================= */

diceBtn.addEventListener(
  "click",
  () => {

    if (!gameId) {

      alert(
        "بازی هنوز شروع نشده."
      );

      return;
    }

    if (
      currentTurn !== socket.id
    ) {

      alert(
        "الان نوبت شما نیست."
      );

      return;
    }

    if (
      remainingMoves.length > 0
    ) {

      alert(
        "هنوز حرکت‌های تاس قبلی تمام نشده."
      );

      return;
    }

    const d1 =
      Math.floor(
        Math.random() * 6
      ) + 1;

    const d2 =
      Math.floor(
        Math.random() * 6
      ) + 1;

    diceValues =
      [d1, d2];

    remainingMoves =
      d1 === d2
        ? [d1, d1, d1, d1]
        : [d1, d2];

    showDice();

    socket.emit(
      "diceRolled",
      {
        gameId: gameId,
        dice: diceValues
      }
    );

    updateTurn();

  }
);


/* =========================================
   نمایش تاس
========================================= */

function showDice() {

  if (
    !diceValues ||
    diceValues.length < 2
  ) {

    diceEl.textContent =
      "🎲 🎲";

    return;
  }

  diceEl.textContent =
    "🎲 " +
    diceValues[0] +
    "     🎲 " +
    diceValues[1];

}


/* =========================================
   دریافت تاس حریف
========================================= */

socket.on("diceRolled", (data) => {

  diceValues =
    data.dice || [];

  showDice();

});


/* =========================================
   ساخت تخته
========================================= */

function renderBoard() {

  boardEl.innerHTML = "";

  boardState.forEach(
    (value, index) => {

      const cell =
        document.createElement("div");

      cell.className =
        "cell";

      cell.dataset.index =
        index;

      const number =
        document.createElement("div");

      number.className =
        "cell-number";

      number.textContent =
        index + 1;

      cell.appendChild(number);


      const checkers =
        document.createElement("div");

      checkers.className =
        "checkers";


      const count =
        Math.abs(value);


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const checker =
          document.createElement("div");

        checker.className =
          "checker " +
          (
            value > 0
              ? "white"
              : "black"
          );

        checkers.appendChild(
          checker
        );

      }


      cell.appendChild(
        checkers
      );


      cell.addEventListener(
        "click",
        () => {

          handlePointClick(
            index
          );

        }
      );


      boardEl.appendChild(cell);

    }
  );

  highlightSelected();

}


/* =========================================
   تشخیص رنگ بازیکن
========================================= */

function myCheckerValue() {

  /*
    بازیکن 1 = سفید
    بازیکن 2 = سیاه
  */

  return myPlayerNumber === 1
    ? 1
    : -1;

}


/* =========================================
   کلیک روی خانه
========================================= */

function handlePointClick(
  point
) {

  if (
    !gameId
  ) return;

  if (
    currentTurn !== socket.id
  ) {

    alert(
      "الان نوبت شما نیست."
    );

    return;
  }


  if (
    remainingMoves.length === 0
  ) {

    alert(
      "اول تاس بریزید."
    );

    return;
  }


  const mine =
    myCheckerValue();


  /*
    مرحله اول:
    انتخاب مهره
  */

  if (
    selectedPoint === null
  ) {

    if (
      boardState[point] * mine > 0
    ) {

      selectedPoint =
        point;

      highlightSelected();

      return;

    } else {

      alert(
        "این مهره متعلق به شما نیست."
      );

      return;
    }

  }


  /*
    کلیک دوباره روی همان خانه
  */

  if (
    selectedPoint === point
  ) {

    selectedPoint =
      null;

    highlightSelected();

    return;

  }


  /*
    مرحله دوم:
    انتخاب مقصد
  */

  const distance =
    calculateDistance(
      selectedPoint,
      point
    );


  if (
    distance === null
  ) {

    alert(
      "حرکت در این جهت مجاز نیست."
    );

    return;

  }


  /*
    بررسی اینکه عدد تاس وجود دارد
  */

  const moveIndex =
    remainingMoves.indexOf(
      distance
    );


  if (
    moveIndex === -1
  ) {

    alert(
      "این حرکت با تاس شما مطابقت ندارد."
    );

    return;

  }


  /*
    بررسی خانه مقصد
  */

  const destination =
    boardState[point];


  /*
    خانه‌ای که دو یا بیشتر مهره حریف دارد
    بسته است.
  */

  if (
    destination * mine < 0 &&
    Math.abs(destination) >= 2
  ) {

    alert(
      "این خانه بسته است."
    );

    return;

  }


  /*
    انجام حرکت
  */

  boardState[
    selectedPoint
  ] -= mine;

  /*
    زدن مهره حریف
  */

  if (
    boardState[point] * mine < 0
  ) {

    boardState[point] =
      mine;

  } else {

    boardState[point] +=
      mine;

  }


  /*
    حذف تاس مصرف‌شده
  */

  remainingMoves.splice(
    moveIndex,
    1
  );


  selectedPoint =
    null;


  /*
    اگر حرکت‌ها تمام شد
    نوبت حریف
  */

  if (
    remainingMoves.length === 0
  ) {

    diceValues =
      [];

    currentTurn =
      currentTurn ===
      player1Id
        ? player2Id
        : player1Id;

    showDice();

  }


  renderBoard();

  updateTurn();


  /*
    ارسال وضعیت به سرور
  */

  socket.emit(
    "gameState",
    {
      gameId:
        gameId,

      board:
        boardState,

      dice:
        diceValues,

      turn:
        currentTurn
    }
  );

}


/* =========================================
   محاسبه جهت حرکت
========================================= */

function calculateDistance(
  from,
  to
) {

  /*
    بازیکن اول:
    از شماره پایین‌تر
    به بالاتر حرکت می‌کند.

    بازیکن دوم:
    برعکس.

    این نسخه برای تست حرکت
    روی تخته 24 خانه طراحی شده.
  */

  if (
    myPlayerNumber === 1
  ) {

    if (
      to <= from
    ) return null;

    return to - from;

  } else {

    if (
      to >= from
    ) return null;

    return from - to;

  }

}


/* =========================================
   هایلایت مهره انتخاب‌شده
========================================= */

function highlightSelected() {

  document
    .querySelectorAll(".cell")
    .forEach(
      cell => {

        cell.classList.remove(
          "selected"
        );

        cell.classList.remove(
          "possible"
        );

      }
    );


  if (
    selectedPoint === null
  ) return;


  const selected =
    document.querySelector(
      `.cell[data-index="${selectedPoint}"]`
    );


  if (selected) {

    selected.classList.add(
      "selected"
    );

  }


  /*
    نمایش خانه‌های ممکن
  */

  remainingMoves.forEach(
    move => {

      let destination;

      if (
        myPlayerNumber === 1
      ) {

        destination =
          selectedPoint + move;

      } else {

        destination =
          selectedPoint - move;

      }


      if (
        destination >= 0 &&
        destination < 24
      ) {

        const cell =
          document.querySelector(
            `.cell[data-index="${destination}"]`
          );

        if (cell) {

          cell.classList.add(
            "possible"
          );

        }

      }

    }
  );

}


/* =========================================
   دریافت وضعیت بازی از حریف
========================================= */

socket.on(
  "gameState",
  (data) => {

    if (data.board) {

      boardState =
        [...data.board];

      renderBoard();

    }

    if (data.dice) {

      diceValues =
        data.dice;

      showDice();

    }

    if (data.turn) {

      currentTurn =
        data.turn;

      updateTurn();

    }

  }
);


/* =========================================
   چت
========================================= */

function sendMessage() {

  const message =
    chatInput.value.trim();

  if (!message) return;


  if (!gameId) {

    alert(
      "ابتدا وارد بازی شوید."
    );

    return;

  }


  socket.emit(
    "chatMessage",
    {
      gameId:
        gameId,

      message:
        message
    }
  );


  chatInput.value =
    "";

}


sendBtn.addEventListener(
  "click",
  sendMessage
);


chatInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      sendMessage();

    }

  }
);


/* =========================================
   دریافت پیام
========================================= */

socket.on(
  "chatMessage",
  data => {

    const div =
      document.createElement("div");

    div.className =
      "message";


    if (
      data.sender === socket.id
    ) {

      div.textContent =
        "🟢 شما: " +
        data.message;

    } else {

      div.textContent =
        "🔵 حریف: " +
        data.message;

    }


    messages.appendChild(
      div
    );

    messages.scrollTop =
      messages.scrollHeight;

  }
);


/* =========================================
   خروج حریف
========================================= */

socket.on(
  "opponentDisconnected",
  data => {

    statusEl.textContent =
      "⚠️ " +
      (
        data.message ||
        "حریف از بازی خارج شد."
      );

    statusEl.className =
      "status error";

    turnEl.textContent =
      "بازی تمام شد";

    diceBtn.disabled =
      true;

  }
);


/* =========================================
   خطای ورود
========================================= */

socket.on(
  "quickJoinError",
  data => {

    quickJoinBtn.disabled =
      false;

    waiting.style.display =
      "none";

    alert(
      data.message ||
      "خطایی در ورود رخ داد."
    );

  }
);


/* =========================================
   نمایش اولیه
========================================= */

renderBoard();

</script>

</body>
</html>
