<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>🎲 Milad Backgammon</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at center,#4b301d 0,#24150d 55%,#100905 100%);
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
}

/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    max-width:1500px;
    margin:auto;
    min-height:100vh;
    padding:12px;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    width:100%;
    max-width:1180px;
    margin:0 auto 10px;
    padding:10px 14px;
    border-radius:14px;
    background:
        linear-gradient(180deg,#6d3515,#351707);
    border:2px solid #9e602d;
    box-shadow:
        0 5px 15px #000,
        inset 0 1px rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    color:#ffd77d;
    font-size:22px;
    font-weight:bold;
}

.server-status{
    font-size:13px;
    color:#7dff9b;
}

/* =====================================================
   LOBBY
===================================================== */

.lobby{
    width:96%;
    max-width:650px;
    margin:30px auto;
    padding:25px;
    background:
        linear-gradient(145deg,#5a2c13,#291108);
    border:2px solid #a35e27;
    border-radius:18px;
    box-shadow:0 10px 35px #000;
    text-align:center;
}

.lobby h1{
    color:#ffd783;
    margin-top:0;
}

.lobby h2{
    color:#fff0c2;
}

.room-input{
    width:100%;
    max-width:300px;
    padding:14px;
    border-radius:10px;
    border:2px solid #a85f22;
    background:#160b06;
    color:#fff;
    text-align:center;
    font-size:20px;
    letter-spacing:4px;
    outline:none;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 22px;
    margin:6px;
    background:
        linear-gradient(180deg,#c9792b,#7c3d12);
    border:2px solid #e7a052;
    color:white;
    font-family:Tahoma;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:
        0 4px 8px #000,
        inset 0 1px rgba(255,255,255,.3);
}

button:active{
    transform:scale(.96);
}

.lobby-message{
    min-height:25px;
    margin-top:12px;
    color:#ffd77d;
}

/* =====================================================
   GAME WRAPPER
===================================================== */

.game{
    display:none;
}

.game.active{
    display:block;
}

   MAIN GAME
===================================================== */

    width:100%;
    max-width:126
