<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Milad Game 🎲</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#111;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    color:#fff;
    overflow-x:hidden;
}

/* =========================
   LOBBY
========================= */

#lobby{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#5b3218 0,#24150d 45%,#090909 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.lobby-box{
    width:min(500px,96vw);
    background:linear-gradient(145deg,#4a2714,#241209);
    border:2px solid #b87535;
    border-radius:22px;
    padding:25px;
    box-shadow:
        0 20px 60px #000,
        inset 0 1px 0 #e4a45e;
    text-align:center;
}

.logo{
    font-size:38px;
    font-weight:bold;
    color:#ffd58c;
    text-shadow:0 3px 5px #000;
    margin-bottom:8px;
}

.subtitle{
    color:#e5c49c;
    margin-bottom:25px;
}

.lobby-card{
    background:rgba(0,0,0,.25);
    border:1px solid #85501f;
    border-radius:16px;
    padding:18px;
    margin:12px 0;
}

.lobby-card h2{
    margin:5px 0 15px;
    color:#ffd38b;
}

.main-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    margin:7px 0;
    background:linear-gradient(#d98b3b,#8b4718);
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 0 #4d230c,0 7px 15px #000;
}

.main-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #4d230c;
}

.room-input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #a9652b;
    background:#170c06;
    color:white;
    text-align:center;
    font-size:20px;
    outline:none;
    margin-bottom:8px;
}

.status{
    min-height:25px;
    color:#8dff9c;
    margin-top:10px;
}

/* =========================
   GAME
========================= */

#game{
    display:none;
    min-height:100vh;
    background:
        linear-gradient(90deg,#181818,#3b2416 15%,#24150d 50%,#3b2416 85%,#181818);
    padding:8px;
}

.game-header{
    width:min(1450px,100%);
    margin:auto;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
}

.game-title{
    color:#ffd48b;
    font-size:22px;
    font-weight:bold;
}

.header-status{
    font-size:13px;
    color:#80ff91;
}

.exit-btn{
    border:1px solid #a65c27;
    background:#45200f;
    color:white;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
}

/* =========================
   TABLE AREA
========================= */

.table-layout{
    width:min(1450px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:150px minmax(600px,1fr) 85px;
    gap:8px;
    align-items:stretch;
}

/* =========================
   PLAYER PANEL
========================= */

.player-panel{
    background:
        linear-gradient(90deg,#512713,#2c1309);
    border:3px solid #6c3517;
    border-radius:4px;
    min-height:720px;
    position:relative;
    overflow:hidden;
    box-shadow:
        inset 0 0 15px #160802,
        0 8px 25px #000;
}

.player-top{
    height:50%;
    padding-top:20px;
    text-align:center;
    border-bottom:3px solid #2b1208;
}

.player-bottom{
    height:50%;
    padding-top:25px;
    text-align:center;
}

.avatar{
    width:88px;
    height:88px;
    border-radius:50%;
    margin:5px auto 10px;
    border:7px solid #4cff24;
    background:
        radial-gradient(circle at 50% 35%,#e9d7c4 0 17%,transparent 18%),
        radial-gradient(circle at 50% 65%,#b8b8b8 0 30%,#777 31% 50%,#ddd 51%);
    box-shadow:
        0 0 0 3px #2b190c,
        0 4px 15px #000;
}

.avatar.opponent{
    border-color:#666;
}

.player-name{
    font-size:15px;
    font-weight:bold;
    margin:5px 0;
}

.player-rating{
    color:#ffc928;
    font-size:18px;
    margin-top:8px;
}

.star{
    color:#ffad22;
    font-size:30px;
}

.flag{
    font-size:25px;
}

/* =========================
   CHAT RAIL
========================= */

.side-rail{
    min-height:720px;
    background:
        linear-gradient(90deg,#3a180b,#9b5729 25%,#55240f 60%,#2a1007);
    border:3px solid #6d3617;
    border-radius:4px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding:25px 5px;
    box-shadow:
        inset 0 0 18px #160702,
        0 8px 25px #000;
}

.rail-button{
    width:58px;
    height:58px;
    border-radius:50%;
    border:2px solid #b87335;
    background:radial-gradient(circle,#ffd767,#c87819);
    font-size:29px;
    cursor:pointer;
    box-shadow:0 4px 10px #000;
}

.rail-space{
    flex:1;
}

/* =========================
   BOARD
========================= */

.board-shell{
    position:relative;
    min-width:0;
    min-height:720px;
    padding:13px;
    border-radius:12px;
    background:
        linear-gradient(90deg,#713612,#d17b37 8%,#713612 92%,#401b0b);
    border:6px solid #311207;
    box-shadow:
        0 15px 35px #000,
        inset 0 0 20px #1c0802;
}

.board{
    position:relative;
    width:100%;
    height:690px;
    display:grid;
    grid-template-columns:repeat(6,1fr) 42px repeat(6,1fr);
    grid-template-rows:1fr 1fr;
    overflow:hidden;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(87,37,12,.15) 0px,
            rgba(87,37,12,.15) 2px,
            rgba(255,190,105,.12) 4px,
            rgba(255,190,105,.12) 8px
        ),
        linear-gradient(#c86e2e,#8e421b);

    border:4px solid #54250d;
    box-shadow:
        inset 0 0 25px #391506,
        0 4px 15px #000;
}

/* wood planks */
.board::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            175deg,
            transparent 0,
            transparent 26px,
            rgba(73,29,8,.18) 27px,
            transparent 30px
        );
    z-index:0;
}

/* =========================
   POINTS
========================= */

.point{
    position:relative;
    overflow:hidden;
    cursor:pointer;
    z-index:2;
}

.point.top{
    grid-row:1;
}

.point.bottom{
    grid-row:2;
}

.point:nth-child(1),
.point:nth-child(3),
.point:nth-child(5),
.point:nth-child(7),
.point:nth-child(9),
.point:nth-child(11),
.point:nth-child(13),
.point:nth-child(15),
.point:nth-child(17),
.point:nth-child(19),
.point:nth-child(21),
.point:nth-child(23){
    background:rgba(83,36,17,.62);
}

.point:nth-child(2),
.point:nth-child(4),
.point:nth-child(6),
.point:nth-child(8),
.point:nth-child(10),
.point:nth-child(12),
.point:nth-child(14),
.point:nth-child(16),
.point:nth-child(18),
.point:nth-child(20),
.point:nth-child(22),
.point:nth-child(24){
    background:rgba(241,126,48,.18);
}

.point.top::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:clamp(18px,3vw,34px) solid transparent;
    border-right:clamp(18px,3vw,34px) solid transparent;
    border-top:300px solid rgba(255,173,84,.7);
    filter:drop-shadow(0 1px 2px #3b1707);
}

.point.bottom::before{
    content:"";
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:clamp(18px,3vw,34px) solid transparent;
    border-right:clamp(18px,3vw,34px) solid transparent;
    border-bottom:300px solid rgba(255,173,84,.7);
    filter:drop-shadow(0 -1px 2px #3b1707);
}

.point.can-move{
    box-shadow:
        inset 0 0 0 4px #35ff31,
        inset 0 0 18px rgba(40,255,30,.5);
}

/* =========================
   BAR / HINGE
========================= */

.bar{
    grid-column:7;
    grid-row:1 / span 2;
    z-index:10;
    background:
        linear-gradient(
            90deg,
            #6c3213,
            #c46f2e 20%,
            #55220b 50%,
            #c46f2e 80%,
            #6c3213
        );
    border-left:4px solid #3b1508;
    border-right:4px solid #3b1508;
    position:relative;
}

.hinge{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:32px;
    height:100px;
    background:
        linear-gradient(90deg,#777,#e9e9e9,#666);
    border:2px solid #333;
    border-radius:4px;
    box-shadow:0 4px 10px #000;
}

.hinge.top{
    top:75px;
}

.hinge.bottom{
    bottom:75px;
}

.hinge::before,
.hinge::after{
    content:"";
    position:absolute;
    left:6px;
    right:6px;
    height:4px;
    background:#333;
}

.hinge::before{
    top:25px;
}

.hinge::after{
    bottom:25px;
}

/* =========================
   CHECKERS
========================= */

.checkers{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:94%;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:20;
    pointer-events:none;
}

.point.top .checkers{
    top:7px;
}

.point.bottom .checkers{
    bottom:7px;
}

.checker{
    width:clamp(30px,4.1vw,54px);
    height:clamp(30px,4.1vw,54px);
    border-radius:50%;
    margin:-2px 0;
    border:3px solid #222;
    pointer-events:auto;
    cursor:pointer;
    position:relative;

    box-shadow:
        0 5px 8px rgba(0,0,0,.8),
        inset 0 5px 8px rgba(255,255,255,.6),
        inset 0 -7px 8px rgba(0,0,0,.45);
}

.checker.white{
    background:
        radial-gradient(circle at 35% 28%,#fff 0 10%,#eee 25%,#aaa 65%,#666 100%);
}

.checker.black{
    background:
        radial-gradient(circle at 35% 25%,#666 0 8%,#333 25%,#111 65%,#000 100%);
    border-color:#080808;
}

.checker.selected{
    outline:4px solid #37ff1c;
    transform:scale(1.08);
    z-index:50;
}

/* =========================
   DICE
========================= */

.dice-area{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:40;
    display:flex;
    gap:12px;
    align-items:center;
}

.die{
    width:72px;
    height:72px;
    background:
        linear-gradient(145deg,#fff,#ddd);
    border:3px solid #aaa;
    border-radius:13px;
    color:#222;
    font-size:42px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 7px 12px #000,
        inset 0 2px 4px #fff;
    direction:ltr;
}

.roll-button{
    position:absolute;
    left:50%;
    top:57%;
    transform:translateX(-50%);
    z-index:45;
    border:2px solid #efb16b;
    background:linear-gradient(#e1943f,#8a4315);
    color:#fff;
    border-radius:10px;
    padding:9px 18px;
    font-family:Tahoma;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 8px #000;
}

.roll-button:active{
    transform:translateX(-50%) translateY(2px);
}

/* =========================
   GAME INFO
========================= */

.game-info{
    position:absolute;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    z-index:40;
    width:75%;
    text-align:center;
}

.message{
    display:inline-block;
    background:rgba(35,15,5,.85);
    border:1px solid #a45f27;
    border-radius:10px;
    padding:6px 12px;
    color:#ffe0ae;
    font-size:13px;
}

/* =========================
   CHAT
========================= */

.chat-window{
    position:fixed;
    right:20px;
    bottom:80px;
    width:310px;
    max-width:90vw;
    background:#2a1409;
    border:2px solid #a9622a;
    border-radius:14px;
    box-shadow:0 10px 30px #000;
    padding:12px;
    z-index:200;
    display:none;
}

.chat-window.open{
    display:block;
}

.chat-title{
    color:#ffd48c;
    font-weight:bold;
    margin-bottom:8px;
}

.chat-messages{
    height:180px;
    overflow-y:auto;
    background:#150a05;
    border-radius:8px;
    padding:8px;
    margin-bottom:8px;
    text-align:right;
}

.chat-message{
    background:#4b2511;
    border-radius:8px;
    padding:6px 8px;
    margin:5px 0;
    font-size:13px;
}

.chat-form{
    display:flex;
    gap:5px;
}

.chat-form input{
    flex:1;
    min-width:0;
    border-radius:8px;
    border:1px solid #8f4e20;
    padding:9px;
    background:#100804;
    color:#fff;
}

.chat-form button{
    border:0;
    border-radius:8px;
    padding:8px 12px;
    background:#a85c23;
    color:#fff;
}

/* =========================
   ROOM CODE
========================= */

.room-code{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:60;
    background:rgba(25,10,3,.82);
    border:1px solid #a7622c;
    border-radius:10px;
    padding:5px 12px;
    color:#ffd28b;
    font-size:13px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:950px){

    #game{
        padding:3px;
    }

    .game-header{
        height:42px;
    }

    .game-title{
        font-size:17px;
    }

    .table-layout{
        grid-template-columns:72px minmax(0,1fr) 48px;
        gap:3px;
    }

    .player-panel{
        min-height:470px;
    }

    .side-rail{
        min-height:470px;
    }

    .board-shell{
        min-height:470px;
        padding:7px;
        border-width:4px;
    }

    .board{
        height:450px;
        grid-template-columns:repeat(6,1fr) 25px repeat(6,1fr);
    }

    .point.top::before,
    .point.bottom::before{
        border-left-width:14px;
        border-right-width:14px;
        border-top-width:195px;
        border-bottom-width:195px;
    }

    .avatar{
        width:50px;
        height:50px;
        border-width:4px;
    }

    .player-name{
        font-size:10px;
        overflow:hidden;
        word-break:break-word;
    }

    .player-rating{
        font-size:12px;
    }

    .star{
        font-size:20px;
    }

    .flag{
        font-size:16px;
    }

    .die{
        width:50px;
        height:50px;
        font-size:28px;
    }

    .dice-area{
        gap:5px;
    }

    .roll-button{
        top:58%;
        font-size:11px;
        padding:6px 10px;
    }

    .hinge{
        width:21px;
        height:65px;
    }

    .hinge.top{
        top:45px;
    }

    .hinge.bottom{
        bottom:45px;
    }

    .rail-button{
        width:38px;
        height:38px;
        font-size:20px;
    }

    .game-info{
        bottom:4px;
    }

    .message{
        font-size:9px;
        padding:4px 6px;
    }
}

@media(max-width:600px){

    .table-layout{
        grid-template-columns:58px minmax(0,1fr) 38px;
    }

    .player-panel{
        min-height:390px;
    }

    .side-rail{
        min-height:390px;
    }

    .board-shell{
        min-height:390px;
    }

    .board{
        height:370px;
    }

    .point.top::before,
    .point.bottom::before{
        border-left-width:10px;
        border-right-width:10px;
        border-top-width:165px;
        border-bottom-width:165px;
    }

    .checker{
        width:24px;
        height:24px;
        border-width:2px;
    }

    .die{
        width:42px;
        height:42px;
        font-size:24px;
    }

    .roll-button{
        font-size:9px;
    }

    .room-code{
        font-size:8px;
    }

    .game-title{
        font-size:13px;
    }

    .header-status{
        display:none;
    }

    .chat-window{
        right:5%;
        bottom:65px;
        width:90%;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOBBY
========================= -->

<section id="lobby">

    <div class="lobby-box">

        <div class="logo">🎲 میلاد گیم</div>

        <div class="subtitle">
            بازی تخته نرد آنلاین و آفلاین
        </div>

        <div class="lobby-card">

            <h2>🎮 بازی آفلاین</h2>

            <button class="main-btn" id="offlineBtn">
                🎮 شروع بازی دو نفره
            </button>

        </div>

        <div class="lobby-card">

            <h2>🌐 بازی آنلاین</h2>

            <button class="main-btn" id="createRoomBtn">
                🏠 ساخت اتاق جدید
            </button>

            <input
                id="roomInput"
                class="room-input"
                maxlength="6"
                inputmode="numeric"
                placeholder="کد ۶ رقمی اتاق"
            >

            <button class="main-btn" id="joinRoomBtn">
                🔑 ورود به اتاق دوست
            </button>

            <div id="lobbyStatus" class="status"></div>

        </div>

    </div>

</section>


<!-- =========================
     GAME
========================= -->

<section id="game">

    <div class="game-header">

        <div class="game-title">
            🎲 میلاد گیم
        </div>

        <div id="connectionStatus" class="header-status">
            آماده بازی
        </div>

        <button class="exit-btn" id="exitBtn">
            خروج
        </button>

    </div>


    <div class="table-layout">

        <!-- PLAYER PANEL -->

        <aside class="player-panel">

            <div class="player-top">

                <div class="star">★</div>

                <div class="flag">🇮🇷</div>

                <div class="avatar opponent"></div>

                <div class="player-name">
                    حریف
                </div>

                <div class="player-rating">
                    ⭐ 3
                </div>

            </div>


            <div class="player-bottom">

                <div class="avatar"></div>

                <div class="flag">
                    🌐
                </div>

                <div class="player-name">
                    Milad Naji
                </div>

                <div class="player-rating">
                    ⭐ 2
                </div>

            </div>

        </aside>


        <!-- BOARD -->

        <main class="board-shell">

            <div id="roomCode" class="room-code">
                آفلاین
            </div>

            <div id="board" class="board">

                <!-- نقاط با JS ساخته می‌شوند -->

                <div class="bar">

                    <div class="hinge top"></div>

                    <div class="hinge bottom"></div>

                </div>

                <div class="dice-area">

                    <div id="die1" class="die">
                        1
                    </div>

                    <div id="die2" class="die">
                        1
                    </div>

                </div>

                <button id="rollBtn" class="roll-button">
                    🎲 انداختن تاس
                </button>

                <div class="game-info">

                    <div id="gameMessage" class="message">
                        نوبت سفید است؛ تاس را بیندازید
                    </div>

                </div>

            </div>

        </main>


        <!-- SIDE RAIL -->

        <aside class="side-rail">

            <button
                id="videoBtn"
                class="rail-button"
                title="تماس"
            >
                📹
            </button>

            <div class="rail-space"></div>

            <button
                id="chatBtn"
                class="rail-button"
                title="چت"
            >
                😊
            </button>

        </aside>

    </div>

</section>


<!-- CHAT -->

<div id="chatWindow" class="chat-window">

    <div class="chat-title">
        💬 چت بازی
    </div>

    <div id="chatMessages" class="chat-messages">

        <div class="chat-message">
            به اتاق بازی خوش آمدید 🎲
        </div>

    </div>

    <form id="chatForm" class="chat-form">

        <input
            id="chatInput"
            autocomplete="off"
            placeholder="پیام..."
        >

        <button type="submit">
            ارسال
        </button>

    </form>

</div>


<script>
"use strict";

/* =====================================================
   CONFIG
===================================================== */

const SERVER_URL = "https://milad-game-server.onrender.com";


/* =====================================================
   GLOBAL STATE
===================================================== */

let socket = null;

let gameMode = "offline";

let roomCode = "";

let playerIndex = 0;

let currentTurn = 0;

let dice = [];

let selectedPosition = null;

let onlineConnected = false;


/* =====================================================
   BOARD

   Positive = white
   Negative = black
===================================================== */

let positions = [
     2,  0,  0,  0,  0, -5,
     0, -3,  0,  0,  0,  5,
    -5,  0,  0,  0,  3,  0,
     5,  0,  0,  0,  0, -2
];

const initialPositions = positions.slice();


/* =====================================================
   ELEMENTS
===================================================== */

const lobby = document.getElementById("lobby");
const game = document.getElementById("game");

const offlineBtn = document.getElementById("offlineBtn");
const createRoomBtn = document.getElementById("createRoomBtn");
const joinRoomBtn = document.getElementById("joinRoomBtn");

const roomInput = document.getElementById("roomInput");
const lobbyStatus = document.getElementById("lobbyStatus");

const board = document.getElementById("board");

const die1 = document.getElementById("die1");
const die2 = document.getElementById("die2");

const rollBtn = document.getElementById("rollBtn");

const gameMessage = document.getElementById("gameMessage");

const roomCodeElement = document.getElementById("roomCode");

const connectionStatus =
    document.getElementById("connectionStatus");

const exitBtn = document.getElementById("exitBtn");

const chatBtn = document.getElementById("chatBtn");

const chatWindow =
    document.getElementById("chatWindow");

const chatMessages =
    document.getElementById("chatMessages");

const chatForm =
    document.getElementById("chatForm");

const chatInput =
    document.getElementById("chatInput");


/* =====================================================
   UTILITY
===================================================== */

function setLobbyStatus(text, color) {

    lobbyStatus.textContent = text;

    if (color) {
        lobbyStatus.style.color = color;
    }

}


function setMessage(text) {

    gameMessage.textContent = text;

}


function isMyTurn() {

    if (gameMode === "offline") {
        return true;
    }

    return currentTurn === playerIndex;

}


/* =====================================================
   SOCKET
===================================================== */

function connectSocket() {

    if (typeof io === "undefined") {

        setLobbyStatus(
            "Socket.IO بارگذاری نشد.",
            "#ff7777"
        );

        return;

    }

    if (socket) {
        return;
    }

    try {

        socket = io(SERVER_URL, {
            transports: ["websocket", "polling"],
            reconnection: true,
            timeout: 10000
        });

        setupSocketEvents();

    } catch (error) {

        console.error(error);

        setLobbyStatus(
            "اتصال آنلاین برقرار نشد.",
            "#ff7777"
        );

    }

}


/* =====================================================
   SOCKET EVENTS
===================================================== */

function setupSocketEvents() {

    socket.on("connect", function() {

        onlineConnected = true;

        connectionStatus.textContent =
            "🟢 اتصال آنلاین برقرار است";

        connectionStatus.style.color =
            "#7cff8d";

    });


    socket.on("disconnect", function() {

        onlineConnected = false;

        connectionStatus.textContent =
            "🔴 اتصال قطع شد";

        connectionStatus.style.color =
            "#ff7777";

    });


    socket.on("connect_error", function(error) {

        console.log("Socket error:", error);

        onlineConnected = false;

        setLobbyStatus(
            "⚠️ سرور آنلاین در دسترس نیست.",
            "#ffb15c"
        );

    });


    socket.on("roomCreated", function(data) {

        roomCode = data.roomCode;

        playerIndex = data.playerIndex;

        currentTurn = 0;

        gameMode = "online";

        roomCodeElement.textContent =
            "اتاق: " + roomCode;

        setLobbyStatus(
            "اتاق ساخته شد: " + roomCode,
            "#7cff8d"
        );

        showGame();

        setMessage(
            "کد اتاق را برای دوستتان بفرستید. منتظر بازیکن دوم..."
        );

    });


    socket.on("joinedRoom", function(data) {

        roomCode = data.roomCode;

        playerIndex = data.playerIndex;

        gameMode = "online";

        roomCodeElement.textContent =
            "اتاق: " + roomCode;

        showGame();

        setMessage(
            "با موفقیت وارد اتاق شدید."
        );

    });


    socket.on("joinError", function(data) {

        setLobbyStatus(
            data.message || "ورود به اتاق انجام نشد.",
            "#ff7777"
        );

    });


    socket.on("playersUpdate", function(data) {

        if (data.players === 1) {

            setMessage(
                "اتاق ساخته شد؛ منتظر بازیکن دوم..."
            );

        }

        if (data.players >= 2) {

            setMessage(
                "هر دو بازیکن آماده‌اند؛ بازی شروع شد 🎲"
            );

        }

    });


    socket.on("gameReady", function(data) {

        if (Array.isArray(data.board)) {

            positions = data.board.slice();

        }

        if (Array.isArray(data.dice)) {

            dice = data.dice.slice();

        }

        if (Array.isArray(data.remainingDice) &&
            data.remainingDice.length) {

            dice = data.remainingDice.slice();

        }

        currentTurn =
            data.turn === 1 ? 1 : 0;

        selectedPosition = null;

        renderBoard();

        updateTurnUI();

    });


    socket.on("gameState", function(data) {

        if (Array.isArray(data.board)) {

            positions = data.board.slice();

        }

        if (Array.isArray(data.remainingDice)) {

            dice = data.remainingDice.slice();

        }

        currentTurn =
            data.turn === 1 ? 1 : 0;

        selectedPosition = null;

        renderBoard();

        updateDiceDisplay();

        updateTurnUI();

    });


    socket.on("diceRolled", function(data) {

        if (Array.isArray(data.dice)) {

            dice = data.dice.slice();

        }

        updateDiceDisplay();

        if (data.player === playerIndex) {

            setMessage(
                "تاس شما: " +
                dice.join(" و ") +
                " — مهره را انتخاب کنید."
            );

        } else {

            setMessage(
                "حریف تاس انداخت 🎲"
            );

        }

    });


    socket.on("chatMessage", function(data) {

        addChatMessage(
            data.text || "",
            data.player
        );

    });

}


/* =====================================================
   SHOW GAME
===================================================== */

function showGame() {

    lobby.style.display = "none";

    game.style.display = "block";

    renderBoard();

    updateDiceDisplay();

    updateTurnUI();

}


/* =====================================================
   OFFLINE
===================================================== */

offlineBtn.addEventListener("click", function() {

    gameMode = "offline";

    roomCode = "";

    playerIndex = 0;

    currentTurn = 0;

    dice = [];

    selectedPosition = null;

    positions = initialPositions.slice();

    roomCodeElement.textContent = "آفلاین";

    setLobbyStatus("");

    showGame();

    setMessage(
        "بازی آفلاین آماده است؛ تاس را بیندازید."
    );

});


/* =====================================================
   CREATE ROOM
===================================================== */

createRoomBtn.addEventListener("click", function() {

    connectSocket();

    if (!socket) {
        return;
    }

    if (!onlineConnected) {

        setLobbyStatus(
            "⏳ در حال اتصال به سرور...",
            "#ffd166"
        );

        setTimeout(function() {

            if (!onlineConnected) {

                setLobbyStatus(
                    "❌ سرور بدون اتصال VPN در دسترس نیست یا هنوز بیدار نشده.",
                    "#ff7777"
                );

            }

        }, 4000);

        return;
    }

    socket.emit("createRoom");

});


/* =====================================================
   JOIN ROOM
===================================================== */

joinRoomBtn.addEventListener("click", function() {

    const code =
        roomInput.value.trim();

    if (!/^\d{6}$/.test(code)) {

        setLobbyStatus(
            "❌ کد اتاق باید دقیقاً ۶ رقمی باشد.",
            "#ff7777"
        );

        return;

    }

    connectSocket();

    if (!socket) {
        return;
    }

    if (!onlineConnected) {

        setLobbyStatus(
            "⏳ ابتدا در حال اتصال به سرور...",
            "#ffd166"
        );

        setTimeout(function() {

            if (onlineConnected) {

                socket.emit(
                    "joinRoom",
                    code
                );

            } else {

                setLobbyStatus(
                    "❌ سرور آنلاین در دسترس نیست.",
                    "#ff7777"
                );

            }

        }, 1500);

        return;

    }

    socket.emit(
        "joinRoom",
        code
    );

});


/* =====================================================
   ROOM INPUT
===================================================== */

roomInput.addEventListener("input", function() {

    this.value =
        this.value.replace(/\D/g, "").slice(0, 6);

});


/* =====================================================
   BOARD BUILD
===================================================== */

function renderBoard() {

    const oldPoints =
        board.querySelectorAll(".point");

    oldPoints.forEach(function(point) {
        point.remove();
    });


    /*
       ترتیب نمایش:
       ردیف بالا: 12 خانه
       وسط: bar
       ردیف پایین: 12 خانه
    */

    for (let i = 0; i < 24; i++) {

        const point =
            document.createElement("div");

        point.className =
            "point " +
            (i < 12 ? "top" : "bottom");

        point.dataset.index = i;

        /*
          چون خانه‌های 13 تا 24 باید سمت دیگر تخته
          از راست به چپ قرار بگیرند، جای ستون را تنظیم می‌کنیم.
        */

        let visualIndex;

        if (i < 12) {

            visualIndex = 12 - i;

        } else {

            visualIndex = i - 11;

        }

        if (visualIndex <= 6) {

            point.style.gridColumn =
                visualIndex;

        } else {

            point.style.gridColumn =
                visualIndex + 1;

        }

        if (i < 12) {

            point.style.gridRow = "1";

        } else {

            point.style.gridRow = "2";

        }

        point.addEventListener(
            "click",
            function() {

                handlePointClick(i);

            }
        );


        const count =
            positions[i] || 0;

        if (count !== 0) {

            const checkers =
                document.createElement("div");

            checkers.className =
                "checkers";


            const color =
                count > 0 ? "white" : "black";

            const number =
                Math.abs(count);


            for (let j = 0; j < number; j++) {

                const checker =
                    document.createElement("div");

                checker.className =
                    "checker " + color;

                checker.dataset.position = i;

                checker.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();

                        selectChecker(i);

                    }
                );

                if (selectedPosition === i) {

                    checker.classList.add(
                        "selected"
                    );

                }

                checkers.appendChild(checker);

            }

            point.appendChild(checkers);

        }


        board.appendChild(point);

    }


    /*
       bar را دوباره به عنوان عنصر مرکزی می‌سازیم
    */

    const bar =
        document.createElement("div");

    bar.className = "bar";

    const hingeTop =
        document.createElement("div");

    hingeTop.className =
        "hinge top";

    const hingeBottom =
        document.createElement("div");

    hingeBottom.className =
        "hinge bottom";

    bar.appendChild(hingeTop);
    bar.appendChild(hingeBottom);

    board.appendChild(bar);


    /*
       تاس
    */

    const diceArea =
        document.createElement("div");

    diceArea.className =
        "dice-area";

    const d1 =
        document.createElement("div");

    d1.className = "die";
    d1.id = "die1";
    d1.textContent =
        dice.length > 0 ? dice[0] : "1";

    const d2 =
        document.createElement("div");

    d2.className = "die";
    d2.id = "die2";
    d2.textContent =
        dice.length > 1 ? dice[1] : "1";

    diceArea.appendChild(d1);
    diceArea.appendChild(d2);

    board.appendChild(diceArea);


    /*
       دکمه تاس
    */

    const button =
        document.createElement("button");

    button.id = "rollBtn";
    button.className =
        "roll-button";

    button.textContent =
        "🎲 انداختن تاس";

    button.addEventListener(
        "click",
        rollDice
    );

    board.appendChild(button);


    /*
       پیام
    */

    const info =
        document.createElement("div");

    info.className =
        "game-info";

    const message =
        document.createElement("div");

    message.className =
        "message";

    message.id =
        "gameMessage";

    message.textContent =
        gameMessage.textContent;

    info.appendChild(message);

    board.appendChild(info);


    showPossibleMoves();

}


/* =====================================================
   SELECT CHECKER
===================================================== */

function selectChecker(position) {

    if (!isMyTurn()) {

        setMessage(
            "⛔ الان نوبت شما نیست."
        );

        return;

    }


    if (dice.length === 0) {

        setMessage(
            "🎲 ابتدا تاس را بیندازید."
        );

        return;

    }


    const value =
        positions[position];

    if (value === 0) {

        return;

    }


    const color =
        value > 0 ? 0 : 1;


    if (gameMode === "offline") {

        /*
           سفید = نوبت 0
           سیاه = نوبت 1
        */

        if (
            (currentTurn === 0 && color !== 0) ||
            (currentTurn === 1 && color !== 1)
        ) {

            setMessage(
                "❌ این مهره متعلق به بازیکن دیگر است."
            );

            return;

        }

    } else {

        if (color !== playerIndex) {

            setMessage(
                "❌ این مهره متعلق به شما نیست."
            );

            return;

        }

    }


    selectedPosition =
        position;

    setMessage(
        "خانه مقصد سبز را انتخاب کنید."
    );

    renderBoard();

}


/* =====================================================
   POINT CLICK
===================================================== */

function handlePointClick(destination) {

    if (selectedPosition === null) {

        return;

    }


    const start =
        selectedPosition;


    const value =
        positions[start];


    if (value === 0) {

        selectedPosition = null;

        renderBoard();

        return;

    }


    const color =
        value > 0 ? 0 : 1;


    /*
       جهت حرکت:
       سفید از خانه پایین به بالا
       سیاه از بالا به پایین
    */

    let distance;

    if (color === 0) {

        distance =
            destination - start;

    } else {

        distance =
            start - destination;

    }


    if (distance <= 0) {

        setMessage(
            "❌ این مهره باید در جهت حرکت خودش حرکت کند."
        );

        return;

    }


    if (!dice.includes(distance)) {

        setMessage(
            "❌ فاصله حرکت با تاس شما مطابقت ندارد."
        );

        return;

    }


    /*
       خانه مقصد
    */

    const target =
        positions[destination] || 0;


    /*
       اگر دو یا بیشتر مهره حریف باشد،
       فعلاً اجازه ورود نمی‌دهیم.
    */

    if (
        target !== 0 &&
        Math.sign(target) !== Math.sign(value) &&
        Math.abs(target) >= 2
    ) {

        setMessage(
            "❌ این خانه توسط دو مهره حریف بسته شده است."
        );

        return;

    }


    /*
       حرکت
    */

    positions[start] -=
        Math.sign(value);


    if (target === 0) {

        positions[destination] =
            Math.sign(value);

    } else if (
        Math.sign(target) === Math.sign(value)
    ) {

        positions[destination] +=
            Math.sign(value);

    } else {

        /*
           زدن یک مهره حریف
        */

        positions[destination] =
            Math.sign(value);

    }


    /*
       مصرف تاس
    */

    const index =
        dice.indexOf(distance);

    if (index >= 0) {

        dice.splice(index, 1);

    }


    selectedPosition =
        null;


    /*
       اگر هنوز تاس داریم،
       همان نوبت ادامه دارد.
    */

    if (dice.length === 0) {

        currentTurn =
            currentTurn === 0 ? 1 : 0;

    }


    renderBoard();

    updateDiceDisplay();

    updateTurnUI();

    syncGame();

}


/* =====================================================
   POSSIBLE MOVES
===================================================== */

function showPossibleMoves() {

    if (
        selectedPosition === null ||
        dice.length === 0
    ) {

        return;

    }


    const points =
        board.querySelectorAll(".point");


    const value =
        positions[selectedPosition];


    if (!value) {
        return;
    }


    const color =
        value > 0 ? 0 : 1;


    dice.forEach(function(number) {

        let target;


        if (color === 0) {

            target =
                selectedPosition + number;

        } else {

            target =
                selectedPosition - number;

        }


        if (
            target >= 0 &&
            target < 24
        ) {

            const targetValue =
                positions[target] || 0;


            if (
                targetValue === 0 ||
                Math.sign(targetValue) === Math.sign(value) ||
                Math.abs(targetValue) < 2
            ) {

                const point =
                    document.querySelector(
                        '.point[data-index="' +
                        target +
                        '"]'
                    );

                if (point) {

                    point.classList.add(
                        "can-move"
                    );

                }

            }

        }

    });

}


/* =====================================================
   ROLL DICE
===================================================== */

function rollDice() {

    if (!isMyTurn()) {

        setMessage(
            "⛔ الان نوبت شما نیست."
        );

        return;

    }


    if (dice.length > 0) {

        setMessage(
            "🎲 هنوز از تاس قبلی حرکت دارید."
        );

        return;

    }


    const d1 =
        Math.floor(Math.random() * 6) + 1;

    const d2 =
        Math.floor(Math.random() * 6) + 1;


    if (d1 === d2) {

        dice =
            [d1,d1,d1,d1];

    } else {

        dice =
            [d1,d2];

    }


    updateDiceDisplay();


    setMessage(
        "🎲 تاس: " +
        d1 +
        " و " +
        d2 +
        " — مهره خود را انتخاب کنید."
    );


    if (gameMode === "online" && socket) {

        socket.emit(
            "diceRolled",
            {
                dice:dice
            }
        );

    }


    syncGame();

}


/* =====================================================
   DICE DISPLAY
===================================================== */

function updateDiceDisplay() {

    const first =
        document.getElementById("die1");

    const second =
        document.getElementById("die2");


    if (!first || !second) {
        return;
    }


    first.textContent =
        dice.length > 0 ? dice[0] : "1";


    second.textContent =
        dice.length > 1 ? dice[1] : "1";

}


/* =====================================================
   TURN UI
===================================================== */

function updateTurnUI() {

    if (gameMode === "offline") {

        setMessage(
            currentTurn === 0
            ? "نوبت سفید است؛ تاس را بیندازید."
            : "نوبت سیاه است؛ تاس را بیندازید."
        );

        return;

    }


    if (currentTurn === playerIndex) {

        setMessage(
            "🟢 نوبت شماست؛ تاس را بیندازید."
        );

    } else {

        setMessage(
            "🟠 نوبت حریف است؛ منتظر بمانید."
        );

    }

}


/* =====================================================
   SYNC GAME
===================================================== */

function syncGame() {

    if (
        gameMode !== "online" ||
        !socket ||
        !onlineConnected ||
        !roomCode
    ) {

        return;

    }


    socket.emit(
        "gameState",
        {
            board:positions,
            dice:dice,
            remainingDice:dice,
            turn:currentTurn
        }
    );

}


/* =====================================================
   EXIT
===================================================== */

exitBtn.addEventListener(
    "click",
    function() {

        if (
            socket &&
            socket.connected &&
            gameMode === "online"
        ) {

            socket.disconnect();

            socket = null;

        }


        gameMode = "offline";

        roomCode = "";

        playerIndex = 0;

        currentTurn = 0;

        dice = [];

        selectedPosition = null;

        positions =
            initialPositions.slice();


        game.style.display =
            "none";

        lobby.style.display =
            "flex";

        setLobbyStatus("");

    }
);


/* =====================================================
   CHAT
===================================================== */

chatBtn.addEventListener(
    "click",
    function() {

        chatWindow.classList.toggle(
            "open"
        );

    }
);


function addChatMessage(
    text,
    player
) {

    if (!text) {
        return;
    }


    const div =
        document.createElement("div");

    div.className =
        "chat-message";


    if (
        player !== undefined &&
        player !== null
    ) {

        div.textContent =
            "بازیکن " +
            (Number(player) + 1) +
            ": " +
            text;

    } else {

        div.textContent =
            text;

    }


    chatMessages.appendChild(div);

    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}


chatForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const text =
            chatInput.value.trim();


        if (!text) {
            return;
        }


        if (
            gameMode === "online" &&
            socket &&
            onlineConnected
        ) {

            socket.emit(
                "chatMessage",
                {
                    text:text
                }
            );

        } else {

            addChatMessage(
                "شما: " + text
            );

        }


        chatInput.value = "";

    }
);


/* =====================================================
   VIDEO BUTTON
===================================================== */

document.getElementById("videoBtn")
    .addEventListener(
        "click",
        function() {

            setMessage(
                "📹 قابلیت تماس تصویری در نسخه بعدی اضافه می‌شود."
            );

        }
    );


/* =====================================================
   START
===================================================== */

renderBoard();

connectSocket();

</script>
