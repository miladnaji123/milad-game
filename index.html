<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milad Game - تخته نرد آنلاین</title>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #171717;
      color: white;
      text-align: center;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: auto;
      padding: 20px 10px;
    }

    h1 {
      margin: 10px 0;
      font-size: 30px;
    }

    .status {
      padding: 12px;
      margin: 15px 0;
      border-radius: 12px;
      background: #292929;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 25px;
      font-size: 17px;
      cursor: pointer;
      margin: 6px;
    }

    #quickJoinBtn {
      background: #16a34a;
      color: white;
      font-weight: bold;
      width: 90%;
      max-width: 350px;
    }

    #quickJoinBtn:disabled {
      opacity: 0.5;
    }

    #diceBtn {
      background: #2563eb;
      color: white;
    }

    .game {
      display: none;
    }

    .players {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 15px 0;
    }

    .player {
      flex: 1;
      padding: 12px;
      background: #292929;
      border-radius: 12px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      background: #6b4226;
      padding: 10px;
      border-radius: 15px;
      margin-top: 15px;
    }

    .cell {
      min-height: 110px;
      background: #d6a15d;
      border-radius: 6px;
      padding: 5px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-direction: column;
    }

    .cell:nth-child(even) {
      background: #b9783c;
    }

    .cell-number {
      font-size: 11px;
      opacity: 0.7;
      margin-bottom: 5px;
    }

    .checker {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin: 1px;
      border: 2px solid #222;
      flex-shrink: 0;
    }

    .white {
      background: white;
    }

    .black {
      background: #111;
    }

    .dice-area {
      margin: 15px 0;
      background: #292929;
      border-radius: 12px;
      padding: 15px;
    }

    .dice {
      font-size: 35px;
      margin: 5px;
      display: inline-block;
    }

    .chat {
      margin-top: 20px;
      background: #292929;
      padding: 15px;
      border-radius: 12px;
    }

    #messages {
      height: 180px;
      overflow-y: auto;
      background: #111;
      padding: 10px;
      border-radius: 10px;
      text-align: right;
      margin-bottom: 10px;
    }

    .message {
      margin: 5px 0;
      padding: 7px;
      background: #333;
      border-radius: 8px;
    }

    .chat-input {
      display: flex;
      gap: 7px;
    }

    #chatInput {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    #sendBtn {
      background: #16a34a;
      color: white;
    }

    .waiting {
      display: none;
      padding: 20px;
      background: #292929;
      border-radius: 12px;
      margin-top: 15px;
    }

    .error {
      color: #ff6b6b;
    }

    .success {
      color: #4ade80;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }

      .cell {
        min-height: 75px;
      }

      .checker {
        width: 22px;
        height: 22px;
      }

      button {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎲 Milad Game</h1>

  <div id="status" class="status">
    در حال اتصال به سرور...
  </div>

  <!-- ورود سریع -->
  <div id="menu">

    <button id="quickJoinBtn">
      ⚡ ورود سریع بدون کد
    </button>

    <div id="waiting" class="waiting">
      ⏳ منتظر پیدا شدن حریف هستید...
      <br><br>
      وقتی بازیکن دیگری وارد شود، بازی خودکار شروع می‌شود.
    </div>

  </div>


  <!-- بازی -->
  <div id="game" class="game">

    <div class="players">

      <div class="player">
        👤 بازیکن اول
        <div id="player1Status">
          آماده
        </div>
      </div>

      <div class="player">
        👤 بازیکن دوم
        <div id="player2Status">
          آماده
        </div>
      </div>

    </div>


    <div id="turn" class="status">
      منتظر شروع بازی...
    </div>


    <div class="dice-area">

      <button id="diceBtn">
        🎲 ریختن تاس
      </button>

      <div id="dice">
        🎲 🎲
      </div>

    </div>


    <!-- تخته -->
    <div id="board" class="board"></div>


    <!-- چت -->
    <div class="chat">

      <h3>💬 چت بازی</h3>

      <div id="messages"></div>

      <div class="chat-input">

        <input
          id="chatInput"
          type="text"
          placeholder="پیام خود را بنویسید..."
          maxlength="500"
        >

        <button id="sendBtn">
          ارسال
        </button>

      </div>

    </div>

  </div>

</div>


<script>

  // =========================================
  // آدرس سرور
  // =========================================

  const SERVER_URL =
    "https://milad-game-server.onrender.com";


  // =========================================
  // اتصال Socket.IO
  // =========================================

  const socket = io(SERVER_URL, {
    transports: ["websocket", "polling"]
  });


  let gameId = null;
  let myPlayerNumber = null;
  let currentBoard = [
    2, 0, 0, 0, 0, -5,
    0, -3, 0, 0, 0, 5,
    -5, 0, 0, 0, 3, 0,
    5, 0, 0, 0, 0, -2
  ];

  let currentTurn = null;


  // =========================================
  // عناصر صفحه
  // =========================================

  const status =
    document.getElementById("status");

  const quickJoinBtn =
    document.getElementById("quickJoinBtn");

  const waiting =
    document.getElementById("waiting");

  const menu =
    document.getElementById("menu");

  const game =
    document.getElementById("game");

  const board =
    document.getElementById("board");

  const dice =
    document.getElementById("dice");

  const diceBtn =
    document.getElementById("diceBtn");

  const turn =
    document.getElementById("turn");

  const messages =
    document.getElementById("messages");

  const chatInput =
    document.getElementById("chatInput");

  const sendBtn =
    document.getElementById("sendBtn");


  // =========================================
  // اتصال
  // =========================================

  socket.on("connect", () => {

    status.textContent =
      "✅ اتصال به سرور برقرار است";

    status.className =
      "status success";

    quickJoinBtn.disabled = false;

  });


  socket.on("connect_error", (error) => {

    console.log(error);

    status.textContent =
      "❌ اتصال به سرور برقرار نشد";

    status.className =
      "status error";

    quickJoinBtn.disabled = true;

  });


  socket.on("disconnect", () => {

    status.textContent =
      "⚠️ اتصال به سرور قطع شد";

    status.className =
      "status error";

  });


  // =========================================
  // ورود سریع
  // =========================================

  quickJoinBtn.addEventListener("click", () => {

    if (!socket.connected) {

      alert("هنوز به سرور متصل نشده‌اید.");

      return;
    }

    quickJoinBtn.disabled = true;

    waiting.style.display = "block";

    status.textContent =
      "⏳ در حال پیدا کردن حریف...";

    socket.emit("quickJoin");

  });


  // =========================================
  // منتظر حریف
  // =========================================

  socket.on("waiting", (data) => {

    waiting.style.display = "block";

    status.textContent =
      data.message ||
      "⏳ منتظر حریف هستید...";

  });


  // =========================================
  // پیدا شدن حریف
  // =========================================

  socket.on("matched", (data) => {

    gameId = data.gameId;

    myPlayerNumber = data.player;

    waiting.style.display = "none";

    menu.style.display = "none";

    game.style.display = "block";

    status.textContent =
      "🎉 حریف پیدا شد!";

    status.className =
      "status success";

  });


  // =========================================
  // شروع بازی
  // =========================================

  socket.on("gameReady", (data) => {

    gameId = data.gameId;

    currentBoard =
      data.board || currentBoard;

    currentTurn =
      data.turn;

    renderBoard();

    updateTurn();

  });


  // =========================================
  // تعداد بازیکنان
  // =========================================

  socket.on("playersUpdate", (data) => {

    if (data.count >= 2) {

      document.getElementById(
        "player1Status"
      ).textContent = "🟢 آنلاین";

      document.getElementById(
        "player2Status"
      ).textContent = "🟢 آنلاین";

    }

  });


  // =========================================
  // وضعیت بازی
  // =========================================

  socket.on("gameState", (data) => {

    if (data.board) {

      currentBoard =
        data.board;

      renderBoard();

    }

    if (data.dice) {

      showDice(data.dice);

    }

    if (data.turn) {

      currentTurn =
        data.turn;

      updateTurn();

    }

  });


  // =========================================
  // تاس
  // =========================================

  diceBtn.addEventListener("click", () => {

    if (!gameId) {

      alert("بازی هنوز شروع نشده.");

      return;
    }

    if (currentTurn !== socket.id) {

      alert("الان نوبت شما نیست.");

      return;
    }

    const d1 =
      Math.floor(Math.random() * 6) + 1;

    const d2 =
      Math.floor(Math.random() * 6) + 1;

    const rolledDice =
      [d1, d2];

    showDice(rolledDice);

    socket.emit("diceRolled", {
      gameId: gameId,
      dice: rolledDice
    });

  });


  socket.on("diceRolled", (data) => {

    showDice(data.dice);

  });


  function showDice(values) {

    if (!values || values.length < 2) {

      dice.textContent =
        "🎲 🎲";

      return;
    }

    dice.textContent =
      "🎲 " + values[0] +
      "    🎲 " + values[1];

  }


  // =========================================
  // نمایش تخته
  // =========================================

  function renderBoard() {

    board.innerHTML = "";

    currentBoard.forEach(
      (value, index) => {

        const cell =
          document.createElement("div");

        cell.className =
          "cell";

        const number =
          document.createElement("div");

        number.className =
          "cell-number";

        number.textContent =
          index + 1;

        cell.appendChild(number);


        const count =
          Math.abs(value);

        for (
          let i = 0;
          i < count;
          i++
        ) {

          const checker =
            document.createElement("div");

          checker.className =
            "checker " +
            (value > 0
              ? "white"
              : "black");

          cell.appendChild(checker);

        }

        board.appendChild(cell);

      }
    );

  }


  // =========================================
  // نوبت
  // =========================================

  function updateTurn() {

    if (!currentTurn) {

      turn.textContent =
        "منتظر شروع بازی...";

      return;
    }

    if (
      currentTurn === socket.id
    ) {

      turn.textContent =
        "🎯 نوبت شماست";

    } else {

      turn.textContent =
        "⏳ نوبت حریف است";

    }

  }


  // =========================================
  // چت
  // =========================================

  function sendMessage() {

    const message =
      chatInput.value.trim();

    if (!message) return;

    if (!gameId) {

      alert("ابتدا وارد بازی شوید.");

      return;
    }

    socket.emit("chatMessage", {

      gameId: gameId,

      message: message

    });

    chatInput.value = "";

  }


  sendBtn.addEventListener(
    "click",
    sendMessage
  );


  chatInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter"
      ) {

        sendMessage();

      }

    }
  );


  socket.on("chatMessage", (data) => {

    const div =
      document.createElement("div");

    div.className =
      "message";

    if (
      data.sender === socket.id
    ) {

      div.textContent =
        "🟢 شما: " +
        data.message;

    } else {

      div.textContent =
        "🔵 حریف: " +
        data.message;

    }

    messages.appendChild(div);

    messages.scrollTop =
      messages.scrollHeight;

  });


  // =========================================
  // خروج حریف
  // =========================================

  socket.on(
    "opponentDisconnected",
    (data) => {

      status.textContent =
        "⚠️ " +
        (data.message ||
        "حریف از بازی خارج شد.");

      status.className =
        "status error";

      turn.textContent =
        "بازی تمام شد";

    }
  );


  // =========================================
  // خطای ورود سریع
  // =========================================

  socket.on(
    "quickJoinError",
    (data) => {

      quickJoinBtn.disabled =
        false;

      waiting.style.display =
        "none";

      alert(
        data.message ||
        "خطایی رخ داد."
      );

    }
  );


  // نمایش اولیه تخته
  renderBoard();

</script>

</body>
</html>
