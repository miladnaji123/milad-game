<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Milad Game 🎲</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --wood-dark:#241109;
    --wood:#6b3519;
    --wood-light:#a85d2a;
    --gold:#e9bb6a;
    --green:#22e66d;
    --cream:#f6e1b1;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 20%,#65351d 0%,#32170c 45%,#160a06 100%);
    color:white;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

header{
    width:100%;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(20,8,3,.72);
    border-bottom:1px solid rgba(233,187,106,.25);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(10px);
}

.logo{
    color:var(--gold);
    font-size:22px;
    font-weight:bold;
}

.server-status{
    font-size:13px;
    padding:7px 12px;
    border-radius:20px;
    background:#34170d;
    color:#ffb7a4;
}

.server-status.online{
    color:#7dffad;
    background:#10351e;
}

/* =========================
   LOBBY
========================= */

#lobby{
    max-width:600px;
    margin:35px auto;
    padding:25px;
    text-align:center;
}

.logo-big{
    font-size:45px;
    margin-bottom:8px;
}

.subtitle{
    color:#e9c98e;
    margin-bottom:25px;
}

.card{
    background:
        linear-gradient(145deg,rgba(120,60,27,.92),rgba(48,22,11,.95));
    border:1px solid rgba(233,187,106,.35);
    border-radius:20px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:
        0 15px 35px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.08);
}

.card h2{
    margin-top:0;
    color:var(--gold);
}

button{
    border:0;
    cursor:pointer;
    color:white;
    font-family:Tahoma,Arial;
    font-size:16px;
    font-weight:bold;
    border-radius:12px;
    padding:13px 20px;
    margin:5px;
    background:
        linear-gradient(180deg,#bd6c2d,#753616);
    box-shadow:
        0 5px 12px rgba(0,0,0,.4),
        inset 0 1px rgba(255,255,255,.2);
    transition:.15s;
}

button:hover{
    filter:brightness(1.12);
}

button:active{
    transform:scale(.96);
}

button.green{
    background:
        linear-gradient(180deg,#27e978,#119a48);
}

button.gray{
    background:
        linear-gradient(180deg,#685344,#34261f);
}

input{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #a86a38;
    outline:none;
    background:#211009;
    color:white;
    font-family:Tahoma;
    font-size:16px;
    margin:7px 0;
}

input:focus{
    border-color:#e6b568;
    box-shadow:0 0 0 2px rgba(230,181,104,.12);
}

.room-row{
    display:flex;
    gap:8px;
}

.room-row input{
    flex:1;
}

.message{
    min-height:25px;
    color:#ffd98d;
    margin-top:10px;
}

/* =========================
   GAME
========================= */

#game{
    display:none;
    width:100%;
    padding:10px;
}

.game-layout{
    width:min(1200px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:180px minmax(400px,720px) 180px;
    gap:14px;
    align-items:center;
}

/* PLAYER PANELS */

.player{
    background:
        linear-gradient(145deg,#522817,#241108);
    border:1px solid #9c5b2d;
    border-radius:18px;
    padding:15px 10px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.45);
    position:relative;
}

.player.active{
    box-shadow:
        0 0 0 3px var(--green),
        0 0 25px rgba(34,230,109,.45);
}

.avatar{
    width:64px;
    height:64px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    background:
        radial-gradient(circle at 35% 25%,#fff,#bbb 30%,#555 65%,#111);
    border:3px solid #d7b875;
    box-shadow:0 5px 12px #000;
}

    background
