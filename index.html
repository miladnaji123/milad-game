<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎲 Milad Game - تخته نرد آنلاین</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    background: #24130b;
    color: #fff;
    font-family: Tahoma, Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 5px 0 15px;
    color: #f5d08a;
}

.panel {
    width: 96%;
    max-width: 720px;
    margin: 12px auto;
    padding: 15px;
    background: #3a1d0e;
    border: 2px solid #8d5428;
    border-radius: 12px;
}

button {
    display: inline-block;
    margin: 6px;
    padding: 12px 20px;
    background: #a85f22;
    color: white;
    border: 2px solid #e0a35e;
    border-radius: 10px;
    font-size: 17px;
    font-family: Tahoma;
    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

input {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #a85f22;
    font-family: Tahoma;
    font-size: 16px;
}

.hidden {
    display: none !important;
}

.status {
    margin: 10px 0;
    color: #7dff9b;
    font-weight: bold;
}

.error {
    color: #ff7777;
}

.success {
    color: #7dff9b;
}

.room-box {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}

.room-box input {
    width: 180px;
    text-align: center;
}

.room-code {
    font-size: 30px;
    color: #ffe08a;
    font-weight: bold;
    letter-spacing: 5px;
    margin: 10px;
}

.players {
    color: #ddd;
    margin: 8px;
}

#message {
    margin: 12px auto;
    color: #f5d08a;
    font-size: 17px;
    max-width: 720px;
}

/* =========================
   BOARD
========================= */

#board {
    width: 96%;
    max-width: 720px;
    height: 430px;
    margin: 20px auto;
    background: #7b421f;
    border: 10px solid #32170a;
    border-radius: 12px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    position: relative;
    overflow: hidden;
}

.cell {
    position: relative;
    border: 1px solid #3a1b0b;
    cursor: pointer;
    overflow: visible;
}

.cell:nth-child(odd) {
    background: #c88742;
}

.cell:nth-child(even) {
    background: #6b2f19;
}

.cell:nth-child(-n+12)::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 190px solid #e5ae66;
    z-index: 1;
    pointer-events: none;
}

.cell:nth-child(n+13)::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 190px solid #e5ae66;
    z-index: 1;
    pointer-events: none;
}

.cell:nth-child(even):nth-child(-n+12)::before {
    border-top-color: #4b2115;
}

.cell:nth-child(even):nth-child(n+13)::before {
    border-bottom-color: #4b2115;
}

.cell.can-move {
    box-shadow: inset 0 0 0 5px #00ff55;
}

.cell.last-move {
    box-shadow: inset 0 0 0 4px #00d9ff;
}

.pieces-top,
.pieces-bottom {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
}

.pieces-top {
    top: 5px;
}

.pieces-bottom {
    bottom: 5px;
}

.checker {
    width: 32px;
    height: 32px;
    margin: -2px auto;
    border-radius: 50%;
    border: 3px solid #111;
    position: relative;
    z-index: 30;
    cursor: pointer;
    box-shadow:
        0 3px 6px rgba(0,0,0,.9),
        inset 0 2px 3px rgba(255,255,255,.5);
}

.checker.white {
    background: #fff;
}

.checker.black {
    background: #111;
}

.checker.selected {
    outline: 4px solid yellow;
    transform: scale(1.1);
}

/* =========================
   DICE
========================= */

.controls {
    margin-top: 15px;
}

.die {
    display: inline-flex;
    width: 70px;
    height: 70px;
    margin: 5px;
    background: white;
    color: black;
    border: 3px solid #111;
    border-radius: 12px;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: bold;
    box-shadow: 0 4px 10px black;
}

/* =========================
   CHAT
========================= */

#chatMessages {
    height: 180px;
    overflow-y: auto;
    text-align: right;
    background: #211108;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

.chat-message {
    padding: 7px;
    margin: 5px 0;
    background: #4b2815;
    border-radius: 6px;
}

.chat-form {
    display: flex;
    gap: 8px;
}

.chat-form input {
    flex: 1;
    min-width: 0;
}

.chat-form button {
    margin: 0;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding: 7px;
    }

    #board {
        height: 310px;
        border-width: 6px;
    }

    .checker {
        width: 23px;
        height: 23px;
        border-width: 2px;
    }

    .cell:nth-child(-n+12)::before {
        border-left-width: 12px;
        border-right-width: 12px;
        border-top-width: 140px;
    }

    .cell:nth-child(n+13)::before {
        border-left-width: 12px;
        border-right-width: 12px;
        border-bottom-width: 140px;
    }

    .die {
        width: 60px;
        height: 60px;
        font-size: 32px;
    }

    .chat-form {
        flex-direction: column;
    }

    .room-box {
        flex-direction: column;
        align-items: center;
    }

    .room-box input {
        width: 90%;
        max-width: 300px;
    }
}
</style>
</head>

<body>

<h1>🎲 بازی تخته نرد میلاد</h1>

<!-- =========================
     LOBBY
========================= -->

<div class="panel" id="lobby">

    <h2>🌐 بازی آنلاین</h2>

    <div id="connectionStatus" class="status">
        🔄 در حال اتصال به سرور...
    </div>

    <button id="createRoomButton">
        🏠 ساخت اتاق
    </button>

    <hr>

    <h3>🚪 ورود به اتاق</h3>

    <div class="room-box">

        <input
            id="roomCodeInput"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="کد ۶ رقمی"
        >

        <button id="joinRoomButton">
            🚪 ورود به اتاق
        </button>

    </div>

    <div id="lobbyMessage"></div>

</div>

<!-- =========================
     ROOM
========================= -->

<div class="panel hidden" id="roomPanel">

    <h2>🎮 اتاق بازی</h2>

    <div>
        کد اتاق:
    </div>

    <div
        id="roomCodeDisplay"
        class="room-code"
    >
        ------
    </div>

    <div
        id="playersDisplay"
        class="players"
    >
        👤 بازیکنان: 1 / 2
    </div>

    <button id="copyRoomButton">
        📋 کپی کد اتاق
    </button>

    <button id="leaveRoomButton">
        🚪 خروج از اتاق
    </button>

</div>

<!-- =========================
     GAME
========================= -->

<div id="gameArea" class="hidden">

    <div id="board"></div>

    <div class="controls">

        <div class="die" id="die1">-</div>
        <div class="die" id="die2">-</div>

        <br>

        <button id="rollButton">
            🎲 انداختن تاس
        </button>

        <button id="endTurnButton">
            🔄 پایان نوبت
        </button>

    </div>

    <div id="message">
        منتظر شروع بازی...
    </div>

</div>

<!-- =========================
     CHAT
========================= -->

<div class="panel" id="chatPanel">

    <h2>💬 چت اتاق</h2>

    <div id="chatMessages">

        <div class="chat-message">
            به چت بازی خوش آمدید 🌹
        </div>

    </div>

    <form
        class="chat-form"
        id="chatForm"
    >

        <input
            id="chatInput"
            type="text"
            maxlength="500"
            placeholder="پیام خود را بنویسید..."
            autocomplete="off"
        >

        <button type="submit">
            ارسال
        </button>

    </form>

</div>

<script>

/* =====================================================
   SERVER
===================================================== */

const SERVER_URL =
    "https://milad-game-server.onrender.com";

/* =====================================================
   SOCKET
===================================================== */

const socket = io(SERVER_URL, {

    transports: ["websocket", "polling"],

    reconnection: true,

    reconnectionAttempts: Infinity,

    reconnectionDelay: 1000,

    timeout: 20000

});

/* =====================================================
   GAME VARIABLES
===================================================== */

let positions = [
     2, 0, 0, 0, 0, -5,
     0,-3, 0, 0, 0,  5,
    -5, 0, 0, 0, 3,  0,
     5, 0, 0, 0, 0, -2
];

let currentPlayer = 0;

let playerIndex = null;

let roomCode = "";

let dice = [];

let remainingDice = [];

let selectedPosition = null;

let gameStarted = false;

let lastMove = null;


/* =====================================================
   ELEMENTS
===================================================== */

const lobby =
    document.getElementById("lobby");

const roomPanel =
    document.getElementById("roomPanel");

const gameArea =
    document.getElementById("gameArea");

const connectionStatus =
    document.getElementById("connectionStatus");

const lobbyMessage =
    document.getElementById("lobbyMessage");

const roomCodeInput =
    document.getElementById("roomCodeInput");

const roomCodeDisplay =
    document.getElementById("roomCodeDisplay");

const playersDisplay =
    document.getElementById("playersDisplay");

const message =
    document.getElementById("message");

const die1 =
    document.getElementById("die1");

const die2 =
    document.getElementById("die2");

const chatMessages =
    document.getElementById("chatMessages");


/* =====================================================
   HELPERS
===================================================== */

function showLobbyMessage(text, type = "") {

    lobbyMessage.textContent = text;

    lobbyMessage.className = type;

}

function setMessage(text) {

    message.textContent = text;

}

function updateDiceDisplay() {

    die1.textContent =
        dice[0] || "-";

    die2.textContent =
        dice[1] || "-";

}

function playerName(index) {

    return index === 0
        ? "سفید"
        : "سیاه";

}


/* =====================================================
   SOCKET CONNECTION
===================================================== */

socket.on("connect", () => {

    console.log(
        "Connected:",
        socket.id
    );

    connectionStatus.textContent =
        "🟢 اتصال به سرور برقرار است";

    connectionStatus.className =
        "status";

});

socket.on("connect_error", (error) => {

    console.error(
        "Socket connection error:",
        error
    );

    connectionStatus.textContent =
        "🔴 اتصال به سرور برقرار نشد";

    connectionStatus.className =
        "error";

});

socket.on("disconnect", (reason) => {

    console.log(
        "Disconnected:",
        reason
    );

    connectionStatus.textContent =
        "🟠 اتصال قطع شد؛ در حال تلاش برای اتصال مجدد...";

    connectionStatus.className =
        "error";

});


/* =====================================================
   CREATE ROOM
===================================================== */

document
.getElementById("createRoomButton")
.addEventListener("click", () => {

    if (!socket.connected) {

        showLobbyMessage(
            "❌ ابتدا صبر کنید تا اتصال به سرور برقرار شود.",
            "error"
        );

        return;
    }

    showLobbyMessage(
        "⏳ در حال ساخت اتاق..."
    );

    socket.emit("createRoom");

});


/* =====================================================
   ROOM CREATED
===================================================== */

socket.on("roomCreated", (data) => {

    roomCode =
        String(data.roomCode);

    playerIndex =
        Number(data.playerIndex);

    currentPlayer = 0;

    roomCodeDisplay.textContent =
        roomCode;

    playersDisplay.textContent =
        "👤 بازیکنان: 1 / 2";

    lobby.classList.add("hidden");

    roomPanel.classList.remove("hidden");

    gameArea.classList.remove("hidden");

    showLobbyMessage("");

    setMessage(
        "🏠 اتاق ساخته شد. کد را برای دوستتان بفرستید."
    );

    buildBoard();

});


/* =====================================================
   JOIN ROOM
===================================================== */

document
.getElementById("joinRoomButton")
.addEventListener("click", joinRoom);

roomCodeInput.addEventListener(
    "keydown",
    (event) => {

        if (event.key === "Enter") {

            joinRoom();

        }

    }
);

function joinRoom() {

    const code =
        roomCodeInput.value
        .trim();

    if (!socket.connected) {

        showLobbyMessage(
            "❌ اتصال به سرور برقرار نیست.",
            "error"
        );

        return;
    }

    if (!/^\d{6}$/.test(code)) {

        showLobbyMessage(
            "❌ کد اتاق باید دقیقاً ۶ رقم باشد.",
            "error"
        );

        return;
    }

    showLobbyMessage(
        "⏳ در حال ورود به اتاق " + code + "..."
    );

    socket.emit(
        "joinRoom",
        code
    );

}


/* =====================================================
   JOINED ROOM
===================================================== */

socket.on("joinedRoom", (data) => {

    roomCode =
        String(data.roomCode);

    playerIndex =
        Number(data.playerIndex);

    roomCodeDisplay.textContent =
        roomCode;

    lobby.classList.add("hidden");

    roomPanel.classList.remove("hidden");

    gameArea.classList.remove("hidden");

    showLobbyMessage("");

    setMessage(
        "✅ وارد اتاق شدید. منتظر بازیکن مقابل باشید."
    );

    buildBoard();

});


/* =====================================================
   JOIN ERROR
===================================================== */

socket.on("joinError", (data) => {

    showLobbyMessage(
        data?.message ||
        "❌ ورود به اتاق انجام نشد.",
        "error"
    );

});


/* =====================================================
   PLAYERS UPDATE
===================================================== */

socket.on("playersUpdate", (data) => {

    const count =
        Number(data.players || 0);

    playersDisplay.textContent =
        "👤 بازیکنان: " +
        count +
        " / 2";

    if (count < 2) {

        gameStarted = false;

        setMessage(
            "⏳ منتظر بازیکن مقابل..."
        );

    }

});


/* =====================================================
   GAME READY
===================================================== */

socket.on("gameReady", (data) => {

    positions =
        Array.isArray(data.board)
            ? data.board.slice()
            : positions;

    dice =
        Array.isArray(data.dice)
            ? data.dice.slice()
            : [];

    remainingDice =
        Array.isArray(data.remainingDice)
            ? data.remainingDice.slice()
            : [];

    currentPlayer =
        Number(data.turn || 0);

    selectedPosition = null;

    gameStarted = true;

    updateDiceDisplay();

    buildBoard();

    setMessage(
        "🎮 بازی شروع شد؛ نوبت " +
        playerName(currentPlayer) +
        " است."
    );

});


/* =====================================================
   GAME STATE
===================================================== */

socket.on("gameState", (data) => {

    if (Array.isArray(data.board)) {

        positions =
            data.board.slice();

    }

    if (Array.isArray(data.dice)) {

        dice =
            data.dice.slice();

    }

    if (
        Array.isArray(
            data.remainingDice
        )
    ) {

        remainingDice =
            data.remainingDice.slice();

    }

    if (
        data.turn === 0 ||
        data.turn === 1
    ) {

        currentPlayer =
            data.turn;

    }

    updateDiceDisplay();

    buildBoard();

    if (gameStarted) {

        setMessage(
            "نوبت " +
            playerName(currentPlayer) +
            " است."
        );

    }

});


/* =====================================================
   DICE ROLL
===================================================== */

document
.getElementById("rollButton")
.addEventListener("click", rollDice);

function rollDice() {

    if (!gameStarted) {

        setMessage(
            "⏳ هنوز بازی شروع نشده است."
        );

        return;
    }

    if (playerIndex !== currentPlayer) {

        setMessage(
            "⛔ الان نوبت شما نیست."
        );

        return;
    }

    if (remainingDice.length > 0) {

        setMessage(
            "🎲 هنوز از تاس قبلی حرکت باقی مانده است."
        );

        return;
    }

    const d1 =
        Math.floor(
            Math.random() * 6
        ) + 1;

    const d2 =
        Math.floor(
            Math.random() * 6
        ) + 1;

    dice = [d1, d2];

    remainingDice =
        d1 === d2
            ? [d1, d1, d1, d1]
            : [d1, d2];

    updateDiceDisplay();

    socket.emit(
        "diceRolled",
        {
            dice: dice
        }
    );

    sendGameState();

    setMessage(
        "🎲 تاس: " +
        d1 +
        " و " +
        d2 +
        " — مهره خود را انتخاب کنید."
    );

}


/* =====================================================
   DICE ROLLED FROM SERVER
===================================================== */

socket.on("diceRolled", (data) => {

    if (Array.isArray(data.dice)) {

        dice =
            data.dice.slice();

        updateDiceDisplay();

    }

});


/* =====================================================
   SELECT CHECKER
===================================================== */

function selectChecker(position) {

    if (!gameStarted) {

        setMessage(
            "⏳ بازی هنوز شروع نشده است."
        );

        return;
    }

    if (playerIndex !== currentPlayer) {

        setMessage(
            "⛔ الان نوبت شما نیست."
        );

        return;
    }

    if (remainingDice.length === 0) {

        setMessage(
            "🎲 ابتدا تاس را بیندازید."
        );

        return;
    }

    const value =
        positions[position];

    if (!value) {

        return;
    }

    const isWhite =
        value > 0;

    const isMine =
        (playerIndex === 0 && isWhite) ||
        (playerIndex === 1 && !isWhite);

    if (!isMine) {

        setMessage(
            "❌ این مهره متعلق به شما نیست."
        );

        return;
    }

    selectedPosition =
        position;

    setMessage(
        "🟢 خانه سبز را برای حرکت انتخاب کنید."
    );

    buildBoard();

}


/* =====================================================
   MOVE CHECKER
===================================================== */

function moveChecker(destination) {

    if (selectedPosition === null) {

        return;
    }

    if (playerIndex !== currentPlayer) {

        return;
    }

    const from =
        selectedPosition;

    const value =
        positions[from];

    if (!value) {

        selectedPosition = null;

        buildBoard();

        return;
    }

    const isWhite =
        value > 0;

    const direction =
        isWhite
            ? 1
            : -1;

    const distance =
        (destination - from) *
        direction;

    if (distance <= 0) {

        setMessage(
            "❌ جهت حرکت مهره صحیح نیست."
        );

        return;
    }

    const diceIndex =
        remainingDice.indexOf(distance);

    if (diceIndex === -1) {

        setMessage(
            "❌ این حرکت با عدد تاس هماهنگ نیست."
        );

        return;
    }

    const target =
        positions[destination] || 0;

    const targetIsOpponent =
        target !== 0 &&
        (
            (isWhite && target < 0) ||
            (!isWhite && target > 0)
        );

    if (
        targetIsOpponent &&
        Math.abs(target) > 1
    ) {

        setMessage(
            "❌ این خانه بسته است."
        );

        return;
    }

    /* Remove checker */

    positions[from] -=
        isWhite ? 1 : -1;

    /* Destination */

    if (targetIsOpponent) {

        positions[destination] =
            isWhite ? 1 : -1;

    } else {

        positions[destination] =
            target +
            (isWhite ? 1 : -1);

    }

    remainingDice.splice(
        diceIndex,
        1
    );

    lastMove = {
        from: from,
        to: destination
    };

    selectedPosition = null;

    if (remainingDice.length === 0) {

        dice = [];

        currentPlayer =
            currentPlayer === 0
                ? 1
                : 0;

        updateDiceDisplay();

    }

    buildBoard();

    sendGameState();

    if (remainingDice.length > 0) {

        setMessage(
            "حرکت انجام شد. هنوز یک حرکت دیگر دارید."
        );

    } else {

        setMessage(
            "🔄 نوبت " +
            playerName(currentPlayer) +
            " است."
        );

    }

}


/* =====================================================
   END TURN
===================================================== */

document
.getElementById("endTurnButton")
.addEventListener("click", () => {

    if (!gameStarted) return;

    if (playerIndex !== currentPlayer) {

        setMessage(
            "⛔ الان نوبت شما نیست."
        );

        return;
    }

    remainingDice = [];

    dice = [];

    selectedPosition = null;

    currentPlayer =
        currentPlayer === 0
            ? 1
            : 0;

    updateDiceDisplay();

    buildBoard();

    sendGameState();

    setMessage(
        "🔄 نوبت " +
        playerName(currentPlayer) +
        " است."
    );

});


/* =====================================================
   SEND GAME STATE
===================================================== */

function sendGameState() {

    if (!socket.connected) {

        return;
    }

    if (!roomCode) {

        return;
    }

    socket.emit(
        "gameState",
        {
            board: positions,
            dice: dice,
            remainingDice: remainingDice,
            turn: currentPlayer
        }
    );

}


/* =====================================================
   BUILD BOARD
===================================================== */

function buildBoard() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    for (
        let i = 0;
        i < 24;
        i++
    ) {

        const cell =
            document.createElement("div");

        cell.className =
            "cell";

        if (
            lastMove &&
            (
                i === lastMove.from ||
                i === lastMove.to
            )
        ) {

            cell.classList.add(
                "last-move"
            );

        }

        cell.addEventListener(
            "click",
            () => moveChecker(i)
        );

        const value =
            positions[i];

        if (value) {

            const holder =
                document.createElement("div");

            holder.className =
                i < 12
                    ? "pieces-top"
                    : "pieces-bottom";

            const count =
                Math.abs(value);

            const color =
                value > 0
                    ? "white"
                    : "black";

            for (
                let j = 0;
                j < count;
                j++
            ) {

                const checker =
                    document.createElement("div");

                checker.className =
                    "checker " +
                    color;

                if (
                    selectedPosition === i
                ) {

                    checker.classList.add(
                        "selected"
                    );

                }

                checker.addEventListener(
                    "click",
                    (event) => {

                        event.stopPropagation();

                        selectChecker(i);

                    }
                );

                holder.appendChild(
                    checker
                );

            }

            cell.appendChild(
                holder
            );

        }

        board.appendChild(cell);

    }

    showMoves();

}


/* =====================================================
   SHOW POSSIBLE MOVES
===================================================== */

function showMoves() {

    if (
        selectedPosition === null
    ) {

        return;
    }

    if (
        remainingDice.length === 0
    ) {

        return;
    }

    const cells =
        document.querySelectorAll(
            ".cell"
        );

    const value =
        positions[
            selectedPosition
        ];

    if (!value) return;

    const isWhite =
        value > 0;

    const direction =
        isWhite ? 1 : -1;

    remainingDice.forEach(
        number => {

            const destination =
                selectedPosition +
                number *
                direction;

            if (
                destination >= 0 &&
                destination < 24
            ) {

                const target =
                    positions[
                        destination
                    ] || 0;

                const blocked =
                    target !== 0 &&
                    (
                        (isWhite && target < 0) ||
                        (!isWhite && target > 0)
                    ) &&
                    Math.abs(target) > 1;

                if (!blocked) {

                    cells[
                        destination
                    ].classList.add(
                        "can-move"
                    );

                }

            }

        }
    );

}


/* =====================================================
   COPY ROOM CODE
===================================================== */

document
.getElementById("copyRoomButton")
.addEventListener("click", async () => {

    if (!roomCode) return;

    try {

        await navigator.clipboard.writeText(
            roomCode
        );

        setMessage(
            "📋 کد اتاق کپی شد: " +
            roomCode
        );

    } catch {

        setMessage(
            "کد اتاق: " +
            roomCode
        );

    }

});


/* =====================================================
   LEAVE ROOM
===================================================== */

document
.getElementById("leaveRoomButton")
.addEventListener("click", () => {

    roomCode = "";

    playerIndex = null;

    gameStarted = false;

    selectedPosition = null;

    dice = [];

    remainingDice = [];

    roomPanel.classList.add(
        "hidden"
    );

    gameArea.classList.add(
        "hidden"
    );

    lobby.classList.remove(
        "hidden"
    );

    roomCodeInput.value = "";

    updateDiceDisplay();

    showLobbyMessage(
        "از اتاق خارج شدید."
    );

    setMessage(
        "منتظر ورود به اتاق جدید..."
    );

});


/* =====================================================
   CHAT SEND
===================================================== */

document
.getElementById("chatForm")
.addEventListener("submit", (event) => {

    event.preventDefault();

    const input =
        document.getElementById(
            "chatInput"
        );

    const text =
        input.value.trim();

    if (!text) return;

    if (!socket.connected) {

        addChatMessage(
            "❌ اتصال به سرور برقرار نیست."
        );

        return;
    }

    if (!roomCode) {

        addChatMessage(
            "❌ ابتدا وارد یک اتاق شوید."
        );

        return;
    }

    socket.emit(
        "chatMessage",
        {
            text: text
        }
    );

    input.value = "";

});


/* =====================================================
   CHAT RECEIVE
===================================================== */

socket.on(
    "chatMessage",
    (data) => {

        const text =
            String(
                data?.text || ""
            );

        if (!text) return;

        let prefix = "";

        if (
            data.player === 0
        ) {

            prefix =
                "⚪ بازیکن سفید: ";

        } else if (
            data.player === 1
        ) {

            prefix =
                "⚫ بازیکن سیاه: ";

        }

        addChatMessage(
            prefix + text
        );

    }
);


/* =====================================================
   ADD CHAT MESSAGE
===================================================== */

function addChatMessage(text) {

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "chat-message";

    item.textContent =
        text;

    chatMessages.appendChild(
        item
    );

    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}


/* =====================================================
   INITIAL BOARD
===================================================== */

buildBoard();

updateDiceDisplay();

</script>

</body>
</html>
